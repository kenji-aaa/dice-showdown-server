<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>みんなでゲーム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4efe0;
    --surface: #ffffff;
    --surface-2: #eae1c8;
    --ink: #23291f;
    --ink-secondary: #5a6653;
    --felt: #2d6a4f;
    --felt-ink: #eef7f0;
    --accent: #b3121a;
    --accent-ink: #fbeceb;
    --border: rgba(35, 41, 31, 0.14);
    --pip: #23291f;
    --shadow: 0 1px 2px rgba(35, 41, 31, 0.08), 0 8px 24px rgba(35, 41, 31, 0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11221a;
      --surface: #1a3327;
      --surface-2: #1f3d2f;
      --ink: #eef2e9;
      --ink-secondary: #9fb3a2;
      --felt: #4e9575;
      --felt-ink: #0d1f17;
      --accent: #e5636a;
      --accent-ink: #3a0f11;
      --border: rgba(238, 242, 233, 0.14);
      --pip: #eef2e9;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 32px rgba(0, 0, 0, 0.35);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Noto Sans JP", "Hiragino Sans", sans-serif;
    min-height: 100vh;
  }
  .wrap { max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-family: "Zen Maru Gothic", "Noto Sans JP", sans-serif; font-weight: 700; margin: 0; font-size: 26px; letter-spacing: 0.02em; }
  .card { background: var(--surface); border: 0.5px solid var(--border); border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; }
  .header { background: var(--felt); color: var(--felt-ink); padding: 1.5rem 1.5rem 1.25rem; text-align: center; }
  .header p { margin: 0.35rem 0 0; font-size: 13px; opacity: 0.85; }
  .body { padding: 1.5rem; display: flex; flex-direction: column; gap: 1.1rem; }
  label { font-size: 13px; color: var(--ink-secondary); display: block; margin-bottom: 0.4rem; }
  input[type="text"] {
    width: 100%; font-family: inherit; font-size: 16px; padding: 0.7rem 0.85rem;
    border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); color: var(--ink);
  }
  input[type="text"]:focus { outline: 2px solid var(--felt); outline-offset: 1px; }
  input.code-input { text-transform: uppercase; letter-spacing: 0.3em; text-align: center; font-size: 20px; font-weight: 700; }
  button {
    font-family: inherit; font-weight: 700; font-size: 15px; border-radius: 10px;
    border: none; padding: 0.75rem 1rem; cursor: pointer;
  }
  button.primary { background: var(--accent); color: var(--accent-ink); }
  button.primary:active { transform: scale(0.98); }
  button.primary:disabled { opacity: 0.45; cursor: default; transform: none; }
  button.ghost { background: transparent; color: var(--ink-secondary); border: 1px solid var(--border); }
  .divider { display: flex; align-items: center; gap: 0.75rem; color: var(--ink-secondary); font-size: 12px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .err { color: var(--accent); font-size: 13px; min-height: 1em; }
  .room-code-row { display: flex; align-items: center; justify-content: center; gap: 0.6rem; }
  .room-code { font-family: "Zen Maru Gothic", sans-serif; font-size: 28px; letter-spacing: 0.28em; font-variant-numeric: tabular-nums; }
  .copy-btn { background: rgba(255,255,255,0.16); color: var(--felt-ink); font-size: 12px; padding: 0.3rem 0.6rem; }
  .leave-link {
    display: block; margin: 0.6rem auto 0; background: none; border: none;
    font-size: 12px; font-weight: 400; color: var(--felt-ink); opacity: 0.7;
    text-decoration: underline; padding: 2px 4px; cursor: pointer;
  }
  .leave-link:hover { opacity: 1; }

  .dice-stage { display: flex; flex-direction: column; align-items: center; gap: 0.6rem; padding: 0.25rem 0 0.5rem; }
  .big-dice-row { display: flex; gap: 10px; }
  .big-die {
    width: 66px; height: 66px; border-radius: 14px; background: var(--surface);
    border: 2px solid var(--border); display: flex; align-items: center; justify-content: center;
  }
  .big-die-face { width: 68%; height: 68%; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); }
  .big-die-face .pip { width: 10px; height: 10px; }
  .big-die.spinning { animation: tumble 0.28s ease-in-out infinite; }
  .big-die.landed { animation: land 0.4s cubic-bezier(.34,1.56,.64,1); border-color: var(--accent); }
  @keyframes tumble {
    0% { transform: rotate(0deg) scale(1); }
    25% { transform: rotate(-16deg) scale(1.05); }
    50% { transform: rotate(13deg) scale(0.95); }
    75% { transform: rotate(-9deg) scale(1.03); }
    100% { transform: rotate(0deg) scale(1); }
  }
  @keyframes land {
    0% { transform: scale(1.4) rotate(0deg); }
    55% { transform: scale(0.9) rotate(0deg); }
    100% { transform: scale(1) rotate(0deg); }
  }
  .dice-sum { font-family: "Zen Maru Gothic", sans-serif; font-size: 15px; color: var(--ink-secondary); opacity: 0; transition: opacity 0.25s ease; }
  .dice-sum.show { opacity: 1; }
  .dice-sum .val { font-size: 22px; color: var(--accent); font-variant-numeric: tabular-nums; }

  .players { display: flex; flex-direction: column; gap: 0.6rem; max-height: 336px; overflow-y: auto; padding-right: 2px; scrollbar-width: thin; }
  .player-row { display: flex; align-items: center; gap: 0.7rem; padding: 0.6rem 0.75rem; border-radius: 12px; background: var(--surface-2); border: 1px solid transparent; }
  .player-row.me { border-color: var(--felt); }
  .player-row.winner { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface-2)); }
  .player-row.spectator { opacity: 0.5; }
  .dice-trio { display: flex; gap: 4px; flex-shrink: 0; }
  .player-name { flex: 1; font-size: 15px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .player-name .you-tag { font-size: 11px; color: var(--ink-secondary); font-weight: 400; margin-left: 0.35em; }
  .player-name .out-tag { font-size: 11px; color: var(--ink-secondary); font-weight: 400; margin-left: 0.35em; }
  .sum-badge { font-family: "Zen Maru Gothic", sans-serif; font-size: 18px; font-weight: 700; min-width: 30px; text-align: right; font-variant-numeric: tabular-nums; }
  .die { width: 26px; height: 26px; border-radius: 6px; background: var(--surface); border: 1px solid var(--border); display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); padding: 4px; flex-shrink: 0; }
  .die.empty { opacity: 0.35; }
  .die:not(.empty) { animation: die-pop 0.28s cubic-bezier(.34,1.56,.64,1); }
  @keyframes die-pop { 0% { transform: scale(0.55); } 100% { transform: scale(1); } }
  .die .pip { width: 3.5px; height: 3.5px; }
  .pip { border-radius: 50%; margin: auto; background: transparent; }
  .pip.on { background: var(--pip); }
  .status-line { text-align: center; font-size: 14px; color: var(--ink-secondary); min-height: 1.4em; }
  .status-line.winner-text { color: var(--accent); font-weight: 700; font-size: 16px; }
  .actions { display: flex; gap: 0.6rem; }
  .actions button { flex: 1; }
  .footnote { text-align: center; font-size: 12px; color: var(--ink-secondary); }

  .game-tabs { display: flex; gap: 6px; background: var(--surface-2); border-radius: 12px; padding: 4px; margin-bottom: 1rem; }
  .game-tab { white-space: nowrap;
    flex: 1; background: transparent; color: var(--ink-secondary); font-weight: 700; font-size: 13px;
    padding: 0.5rem 0.4rem; border-radius: 9px;
  }
  .game-tab.active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

  textarea {
    width: 100%; font-family: inherit; font-size: 14px; padding: 0.6rem 0.7rem; resize: vertical;
    border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); color: var(--ink);
  }
  textarea:focus { outline: 2px solid var(--felt); outline-offset: 1px; }

  .amida-slots { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 0.8rem; }
  .amida-slot {
    flex: 1 1 72px; min-width: 72px; padding: 0.55rem 0.4rem; border-radius: 10px;
    background: var(--surface-2); border: 1px solid var(--border); text-align: center;
    font-size: 13px; cursor: pointer; overflow: hidden;
  }
  .amida-slot .num { display: block; font-size: 11px; color: var(--ink-secondary); margin-bottom: 2px; }
  .amida-slot .who { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .amida-slot.taken { background: color-mix(in srgb, var(--felt) 15%, var(--surface-2)); border-color: var(--felt); }
  .amida-slot.mine { border-color: var(--accent); font-weight: 700; }
  .amida-slot.blocked { cursor: default; opacity: 0.85; }

  .amida-scroll { overflow-x: auto; padding-bottom: 4px; margin-bottom: 0.8rem; }
  .amida-row { display: flex; }
  .amida-row > div {
    width: var(--col-w, 56px); flex-shrink: 0; text-align: center; font-size: 12px; color: var(--ink-secondary);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 2px;
  }
  .amida-row > div.me { color: var(--felt); font-weight: 700; }
  #amida-svg { display: block; }
  .amida-line { stroke: var(--ink-secondary); stroke-width: 2; opacity: 0.5; }
  .amida-path { fill: none; stroke-width: 3; stroke-linecap: round; opacity: 0.9; }

  .amida-results { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 0.8rem; max-height: 300px; overflow-y: auto; }
  .amida-result-row {
    display: flex; align-items: center; gap: 0.7rem; padding: 0.55rem 0.75rem; border-radius: 12px;
    background: var(--surface-2); border: 1px solid transparent; cursor: default;
  }
  .amida-result-row.clickable { cursor: pointer; }
  #amida-outcomes > div { cursor: pointer; }
  .amida-result-row.me { border-color: var(--felt); }
  .amida-result-row.highlighted { border-color: var(--result-color, var(--accent)); }
  .amida-result-swatch { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; background: var(--ink-secondary); }
  .amida-result-name { flex: 1; font-size: 15px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .amida-result-name .tag { font-size: 11px; color: var(--felt); font-weight: 700; margin-left: 0.35em; }
  .amida-result-label { font-weight: 700; font-size: 14px; max-width: 40%; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .amida-result-row.atari { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, var(--surface-2)); }
  .amida-result-row.atari .amida-result-label { color: var(--accent); font-size: 16px; }
  #amida-outcomes > div.atari { color: var(--accent); font-weight: 700; }

  .amida-banner {
    position: fixed; top: 38%; left: 50%; z-index: 60; pointer-events: none;
    background: var(--accent); color: var(--accent-ink);
    font-family: "Zen Maru Gothic", sans-serif; font-weight: 700; font-size: 22px;
    padding: 1rem 1.75rem; border-radius: 18px; box-shadow: var(--shadow);
    text-align: center; white-space: nowrap;
    transform: translate(-50%, -50%) scale(0.4); opacity: 0;
    transition: transform 0.45s cubic-bezier(.34,1.56,.64,1), opacity 0.25s ease;
  }
  .amida-banner.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  @keyframes amida-pulse {
    0%, 100% { transform: scale(1); }
    35% { transform: scale(1.05); }
  }
  .amida-result-row.impact { animation: amida-pulse 0.5s ease; }


  .roulette-wrap { position: relative; width: 100%; max-width: 360px; margin: 0.5rem auto 0.8rem; }
  #roulette-canvas { width: 100%; height: auto; display: block; }
  .roulette-pointer {
    position: absolute; top: -4px; left: 50%; transform: translateX(-50%); z-index: 2;
    width: 0; height: 0; border-left: 13px solid transparent; border-right: 13px solid transparent;
    border-top: 26px solid var(--accent); filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3));
  }
  .roulette-wrap.landed { animation: roulette-land 0.7s cubic-bezier(.34,1.56,.64,1); }
  @keyframes roulette-land { 0% { transform: scale(1); } 35% { transform: scale(1.09); } 100% { transform: scale(1); } }
  .roulette-pointer.tick { animation: pointer-tick 0.09s ease-out; transform-origin: 50% 0; }
  @keyframes pointer-tick { 0% { transform: translateX(-50%) rotate(0deg); } 40% { transform: translateX(-50%) rotate(-22deg); } 100% { transform: translateX(-50%) rotate(0deg); } }
  .flash-screen {
    position: fixed; inset: 0; z-index: 55; pointer-events: none;
    background: radial-gradient(circle at 50% 40%, rgba(255,245,170,0.85), rgba(255,200,60,0.0) 70%);
    animation: flash-fade 0.9s ease-out forwards;
  }
  @keyframes flash-fade { 0% { opacity: 0; } 15% { opacity: 1; } 100% { opacity: 0; } }
  #confetti-canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 58; pointer-events: none; }
  .amida-banner.big { font-size: 34px; padding: 1.4rem 2.2rem; border-radius: 24px; border: 4px solid #ffe27a; }
  .roulette-opt { display: flex; align-items: center; gap: 0.5rem; font-size: 13px; color: var(--ink-secondary); margin: 0.4rem 0 0.2rem; cursor: pointer; }
  .roulette-opt input { width: 16px; height: 16px; }
  .roulette-won { font-size: 12px; color: var(--ink-secondary); margin-bottom: 0.8rem; min-height: 1em; }

  .amida-scroll.narrow .amida-row > div { font-size: 10px; padding: 0; }
  .amida-hint { text-align: center; font-size: 13px; color: var(--ink-secondary); margin-bottom: 0.6rem; min-height: 1.4em; }
  .amida-hint.big { font-family: "Zen Maru Gothic", sans-serif; font-size: 18px; font-weight: 700; color: var(--accent); }
  .amida-row > div.open { color: var(--accent); font-weight: 700; cursor: pointer; border: 1px dashed var(--accent); border-radius: 8px; }
  .amida-row > div.taken { font-weight: 700; }
  .amida-row > div.mine { font-weight: 700; text-decoration: underline; cursor: pointer; }
  .amida-row > div.atari { color: var(--accent); font-weight: 700; font-size: 13px; }
  .amida-row > div.spot { color: var(--accent); font-weight: 700; font-size: 14px; animation: spot-pulse 0.7s ease-in-out infinite alternate; }
  @keyframes spot-pulse { from { transform: scale(1); text-shadow: 0 0 0 rgba(255,190,40,0); } to { transform: scale(1.25); text-shadow: 0 0 12px rgba(255,190,40,0.95); } }
  .amida-row > div.win-pop { color: var(--accent); font-weight: 700; animation: win-pop 0.9s cubic-bezier(.34,1.56,.64,1); }
  @keyframes win-pop { 0% { transform: scale(1); } 40% { transform: scale(1.6); } 100% { transform: scale(1.15); } }
  .amida-row > div.blink { animation: name-blink 0.3s steps(2) infinite; }
  @keyframes name-blink { 50% { opacity: 0.2; } }
  .amida-rung { stroke: var(--ink-secondary); stroke-width: 3; opacity: 0.55; stroke-linecap: round; }
  .amida-rung-new { animation: rung-in 0.6s ease both; }
  @keyframes rung-in { from { opacity: 0; } to { opacity: 0.55; } }
  #amida-svg { cursor: crosshair; }
  .amida-scroll.climbing .amida-line, .amida-scroll.climbing .amida-rung { opacity: 0.18; }
  .amida-scroll.climbing .amida-rung[style*="stroke:"] { opacity: 0.35; }
  .amida-scroll.climbing { background: radial-gradient(ellipse at 50% 50%, rgba(255,190,40,0.10), transparent 70%); }
  #amida-outcomes > div { cursor: default; }
  .room-game-name { font-family: "Zen Maru Gothic", sans-serif; font-size: 20px; font-weight: 700; margin-bottom: 0.5rem; }
  .host-note { text-align: center; font-size: 12px; color: var(--ink-secondary); margin-bottom: 0.9rem; }
  .member-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: -0.3rem 0 0.9rem; }
  .member-chip { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); }
  .member-chip.me { border-color: var(--felt); font-weight: 700; }
  .member-chip.spec { opacity: 0.5; text-decoration: line-through; }
  .member-chip.pick { cursor: pointer; }
  .member-chip.pick:hover { border-color: var(--accent); }
  .member-tip { width: 100%; text-align: center; font-size: 11px; color: var(--ink-secondary); }
  .member-count { width: 100%; text-align: center; font-size: 11px; color: var(--ink-secondary); }
  .cards-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 0.8rem 0; perspective: 900px; }
  .card3d { width: 96px; cursor: pointer; text-align: center; }
  .card3d .inner { position: relative; width: 96px; height: 130px; transform-style: preserve-3d; transition: transform 0.7s cubic-bezier(.3,1.3,.5,1); }
  .card3d.flipped .inner { transform: rotateY(180deg); }
  .card3d .face { position: absolute; inset: 0; border-radius: 12px; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; font-family: "Zen Maru Gothic", sans-serif; font-weight: 700; box-shadow: 0 2px 6px rgba(0,0,0,0.2); }
  .card3d .back { background: repeating-linear-gradient(45deg, var(--felt), var(--felt) 8px, color-mix(in srgb, var(--felt) 80%, #000) 8px, color-mix(in srgb, var(--felt) 80%, #000) 16px); color: var(--felt-ink); font-size: 26px; border: 3px solid var(--felt-ink); }
  .card3d .front { background: var(--surface); transform: rotateY(180deg); font-size: 17px; border: 3px solid var(--border); color: var(--ink-secondary); }
  .card3d .front { flex-direction: column; gap: 4px; line-height: 1; }
  .card3d .front .em { font-size: 44px; line-height: 1; }
  .card3d .front .lb { font-size: 15px; font-weight: 700; letter-spacing: 0.05em; }
  .card3d.atari .front { background: #fff3c4; color: var(--accent); border-color: #ffb400; box-shadow: 0 0 22px rgba(255,180,0,0.9); }
  .card3d.mine .back { border-color: var(--accent); }
  .card3d.taken .back { filter: brightness(0.85); }
  .card3d.disabled { cursor: default; }
  .card3d .who { margin-top: 6px; font-size: 12px; min-height: 1.3em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-secondary); }
  .card3d.mine .who { color: var(--accent); font-weight: 700; }
  .card3d.shake .inner { animation: card-shake 0.18s linear infinite; }
  @keyframes card-shake { 0%,100% { transform: translateX(0) rotate(0); } 25% { transform: translateX(-3px) rotate(-3deg); } 75% { transform: translateX(3px) rotate(3deg); } }
  .race-call { text-align: center; font-family: "Zen Maru Gothic", sans-serif; font-weight: 700; font-size: 20px; min-height: 1.6em; margin: 0.2rem 0 0.6rem; color: var(--accent); }
  .race-call.count { font-size: 56px; }
  .race-call.count.small { font-size: 34px; }
  .race-map { margin: 0 0 8px; }
  .race-map .txt { text-align: center; font-size: 14px; font-weight: 700; color: var(--ink-secondary); margin-bottom: 4px; }
  .race-map .txt b { font-family: "Zen Maru Gothic", sans-serif; font-size: 22px; color: var(--accent); }
  .race-map .bar { position: relative; height: 22px; margin-left: 104px; border-radius: 11px; background: var(--surface-2); border: 1px solid var(--border); }
  .race-map .bar .fin { position: absolute; right: 4px; top: 0; line-height: 20px; font-size: 14px; }
  .race-map .dot { position: absolute; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,0.25); }
  .race-map .dot.lead { width: 16px; height: 16px; margin: -8px 0 0 -8px; z-index: 2; }
  .race-fx { position: fixed; inset: 0; z-index: 58; pointer-events: none; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .race-fx::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 50% 45%, rgba(0,0,0,0.2), rgba(0,0,0,0.82)); opacity: 0; transition: opacity 0.5s; }
  .race-fx.dark::before { opacity: 1; }
  .race-fx .vig { position: absolute; inset: 0; opacity: var(--vig, 0); transition: opacity 0.3s; background: radial-gradient(ellipse at center, transparent 50%, rgba(225,20,20,0.6)); animation: fx-beat 0.5s ease-in-out infinite alternate; }
  .race-fx .vig.dim { background: radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,0.78)); animation: none; }
  @keyframes fx-beat { from { filter: brightness(0.8); } to { filter: brightness(1.35); } }
  .race-lanes .speed { position: absolute; top: 0; bottom: 0; left: 104px; right: 0; pointer-events: none; border-radius: 0 12px 12px 0; opacity: var(--spd, 0); transition: opacity 0.6s;
    background: repeating-linear-gradient(0deg, transparent 0 29px, rgba(90,70,50,0.5) 29px 31px, transparent 31px 67px, rgba(90,70,50,0.4) 67px 69px, transparent 69px 113px);
    -webkit-mask-image: repeating-linear-gradient(90deg, #000 0 110px, transparent 110px 360px); mask-image: repeating-linear-gradient(90deg, #000 0 110px, transparent 110px 360px);
    -webkit-mask-size: 360px 100%; mask-size: 360px 100%; animation: fx-speed 0.28s linear infinite; }
  @keyframes fx-speed { from { -webkit-mask-position: 0 0; mask-position: 0 0; } to { -webkit-mask-position: -360px 0; mask-position: -360px 0; } }

    font-family: "DotGothic16", "Zen Maru Gothic", monospace; color: #ffb52e; text-shadow: 0 0 4px rgba(255,170,40,0.7);

  .led-row.on { opacity: 1; animation: led-flash 0.7s steps(2) 2; }

  @keyframes led-blink { 50% { opacity: 0.15; } }
  @keyframes led-flash { 50% { filter: brightness(2.2); } }

  .race-lanes.stage { display: block; padding: 0; line-height: 0; background: #2e7d32; border-radius: 14px; overflow: hidden; box-shadow: 0 6px 18px rgba(0,0,0,0.25); }

  .race-goal { position: absolute; right: 0; top: 0; bottom: 0; width: 8px; background: repeating-linear-gradient(0deg, #222 0 6px, #fff 6px 12px); opacity: 0.85; }

<div class="wrap">

            <button class="ghost" id="race-again-btn" hidden>もう一度レース</button>

      <div class="footnote">このブラウザがあなたの席です。他の人は同じ合言葉で参加してください。</div>
    </div>
  </section>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
(function () {
  var PIP_MAP = {
    1: [5], 2: [1, 9], 3: [1, 5, 9], 4: [1, 3, 7, 9],
    5: [1, 3, 5, 7, 9], 6: [1, 3, 4, 6, 7, 9]
  };

  function pipsHTML(value) {
    var on = value ? PIP_MAP[value] : [];
    var cells = '';
    for (var i = 1; i <= 9; i++) {
      cells += '<span class="pip' + (on.indexOf(i) !== -1 ? ' on' : '') + '"></span>';
    }
    return cells;
  }
  function dieFaceHTML(value) {
    return '<div class="die' + (value ? '' : ' empty') + '">' + pipsHTML(value) + '</div>';
  }
  function trioHTML(values) {
    values = values || [null, null, null];
    return '<div class="dice-trio">' + values.map(dieFaceHTML).join('') + '</div>';
  }
  function randomFace() { return 1 + Math.floor(Math.random() * 6); }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function getPlayerId() {
    var id = localStorage.getItem('dice_player_id');
    if (!id) {
      id = 'p_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
      localStorage.setItem('dice_player_id', id);
    }
    return id;
  }

  var playerId = getPlayerId();
  var nameInput = document.getElementById('name-input');
  var codeInput = document.getElementById('code-input');
  var createBtn = document.getElementById('create-btn');
  var joinBtn = document.getElementById('join-btn');
  var entryErr = document.getElementById('entry-err');
  var entrySection = document.getElementById('entry');
  var roomSection = document.getElementById('room');
  var roomCodeDisplay = document.getElementById('room-code-display');
  var copyBtn = document.getElementById('copy-btn');
  var leaveBtn = document.getElementById('leave-btn');
  var playersList = document.getElementById('players-list');
  var statusLine = document.getElementById('status-line');
  var rollBtn = document.getElementById('roll-btn');
  var nextRoundBtn = document.getElementById('next-round-btn');
  var diceStage = document.getElementById('dice-stage');
  var diceSum = document.getElementById('dice-sum');
  var diceSumVal = document.getElementById('dice-sum-val');
  var bigDieEls = [
    { die: document.getElementById('big-die-0'), face: document.getElementById('big-die-face-0') },
    { die: document.getElementById('big-die-1'), face: document.getElementById('big-die-face-1') },
    { die: document.getElementById('big-die-2'), face: document.getElementById('big-die-face-2') }
  ];

  var tabDice = document.getElementById('tab-dice');
  var tabAmida = document.getElementById('tab-amida');
  var tabRace = document.getElementById('tab-race');
  var tabCards = document.getElementById('tab-cards');
  var tabRoulette = document.getElementById('tab-roulette');
  var rouletteGameDiv = document.getElementById('roulette-game');
  var rouletteCanvas = document.getElementById('roulette-canvas');
  var rouletteStatus = document.getElementById('roulette-status');
  var rouletteExcludeCb = document.getElementById('roulette-exclude');
  var rouletteWonDiv = document.getElementById('roulette-won');
  var rouletteSpinBtn = document.getElementById('roulette-spin-btn');
  var rouletteClearBtn = document.getElementById('roulette-clear-btn');
  var diceGameDiv = document.getElementById('dice-game');
  var amidaGameDiv = document.getElementById('amida-game');
  var amidaSetupDiv = document.getElementById('amida-setup');
  var amidaCountNote = document.getElementById('amida-count-note');
  var amidaStartBtn = document.getElementById('amida-start-btn');
  var amidaErr = document.getElementById('amida-err');
  var amidaBanner = document.getElementById('amida-banner');
  var amidaBoardWrap = document.getElementById('amida-board-wrap');
  var amidaHint = document.getElementById('amida-hint');
  var amidaScrollEl = document.getElementById('amida-scroll');
  var amidaNamesRow = document.getElementById('amida-names');
  var amidaSvg = document.getElementById('amida-svg');
  var amidaOutcomesRow = document.getElementById('amida-outcomes');
  var amidaPickingStatus = document.getElementById('amida-picking-status');
  var amidaResultsDiv = document.getElementById('amida-results');
  var amidaBeginBtn = document.getElementById('amida-begin-btn');
  var amidaRevealBtn = document.getElementById('amida-reveal-btn');
  var amidaCancelBtn = document.getElementById('amida-cancel-btn');
  var amidaAgainBtn = document.getElementById('amida-again-btn');
  var amidaRunErr = document.getElementById('amida-run-err');

  var AMIDA_COLORS = ['#c1440e', '#1d6fa5', '#8a5cb5', '#c2185b', '#2e8b57', '#b8860b', '#5c6bc0', '#00838f'];
  var AMIDA_COL_WIDTH = 56;
  var AMIDA_COL_MAX = 90;
  var AMIDA_COL_MIN = 26;
  var AMIDA_MARGIN_Y = 10;
  var AMIDA_ROW_H = 14;
  var amidaSessionId = null;
  var amidaRevealSeen = null;
  var amidaAnimating = false;
  var amidaAnimId = null;
  var amidaIntroPlayed = false;

  nameInput.value = localStorage.getItem('dice_name') || '';

  var socket = io();
  var latestData = null;
  var isRolling = false;
  var isConnected = false;
  // The room+name we should be in. Re-sent on every 'connect' (including
  // reconnects after a dropped connection), so a lost join/roll never
  // leaves the player stuck with an unresponsive button.
  var desired = null;
  var pendingCreateName = null;
  var pendingCreateReq = null;

  function setErr(msg) { entryErr.textContent = msg || ''; }

  var disconnectDebounce = null;

  function setConnUI() {
    var busy = !isConnected;
    createBtn.disabled = busy || !!pendingCreateName;
    joinBtn.disabled = busy;
    render();
  }

  socket.on('connect', function () {
    if (disconnectDebounce) { clearTimeout(disconnectDebounce); disconnectDebounce = null; }
    isConnected = true;
    setConnUI();
    if (desired) {
      socket.emit('join_room', { code: desired.code, name: desired.name, pid: playerId });
    } else if (pendingCreateName) {
      socket.emit('create_room', { name: pendingCreateName, pid: playerId, game: chosenGame, reqId: pendingCreateReq });
    }
  });

  socket.on('disconnect', function () {
    isConnected = false;
    // A reconnect during a Render cold start (or any brief network blip)
    // can flap connect/disconnect a few times in quick succession. Wait a
    // moment before showing the "disconnected" UI so a fast recovery never
    // reads as the buttons flickering.
    if (disconnectDebounce) clearTimeout(disconnectDebounce);
    disconnectDebounce = setTimeout(function () {
      disconnectDebounce = null;
      setConnUI();
    }, 400);
  });

  socket.on('joined', function (payload) {
    pendingCreateName = null;
    desired = { code: payload.code, name: nameInput.value.trim() || localStorage.getItem('dice_name') || '' };
    localStorage.setItem('dice_room_code', payload.code);
    roomCodeDisplay.textContent = payload.code;
    entrySection.hidden = true;
    roomSection.hidden = false;
    createBtn.disabled = false;
    joinBtn.disabled = false;
  });

  function backToEntry(message) {
    desired = null;
    pendingCreateName = null;
    latestData = null;
    localStorage.removeItem('dice_room_code');
    roomSection.hidden = true;
    entrySection.hidden = false;
    createBtn.disabled = false;
    joinBtn.disabled = false;
    setErr(message);
  }

  socket.on('join_error', function (e) {
    createBtn.disabled = false;
    joinBtn.disabled = false;
    pendingCreateName = null;
    if (e.code === 'not_found') {
      // Whether this was a manual join or a silent auto-rejoin after a
      // reconnect, the room is gone — always return to a working entry
      // screen instead of leaving a stale/frozen room view on screen.
      backToEntry('前回の部屋は見つかりませんでした。もう一度部屋を作るか、合言葉を入力してください。');
    } else {
      setErr('通信に失敗しました。');
    }
  });

  socket.on('state', function (data) {
    latestData = data;
    render();
  });

  function renderDice() {
    var round = latestData.round || 1;
    var players = latestData.players || [];
    var rolls = latestData.rolls || {};
    var activeIds = latestData.activeIds || null;

    var rows = players.map(function (p) {
      var r = rolls[p.id];
      var hasCurrent = r && r.round === round;
      var isActive = (latestData.spectators || []).indexOf(p.id) === -1 && (!activeIds || activeIds.indexOf(p.id) !== -1);
      return {
        pid: p.id, name: p.name,
        values: hasCurrent ? r.values : null,
        sum: hasCurrent ? r.sum : null,
        active: isActive
      };
    });

    var activeRows = rows.filter(function (r) { return r.active; });
    var allRolled = activeRows.length > 0 && activeRows.every(function (r) { return r.sum !== null; });
    var maxSum = allRolled ? Math.max.apply(null, activeRows.map(function (r) { return r.sum; })) : null;
    var winners = allRolled ? activeRows.filter(function (r) { return r.sum === maxSum; }) : [];

      var tag = isMe ? '<span class="you-tag">あなた</span>' : (!r.active ? '<span class="out-tag">見学中</span>' : '');
      return '<div class="' + cls + '">' +

      }
    }

    nextRoundBtn.textContent = isTie ? '同点者で振り直す' : '新しいゲーム';

  function nameForPid(pid) {
    var p = (latestData.players || []).find(function (x) { return x.id === pid; });
    return p ? p.name : '(退出済み)';
  }

  // Full top-to-bottom route for startCol, alternating "just above a rung
  // row" / "just below it" points so the drawn line visibly steps sideways
  // exactly where a real rung is crossed.
  function amidaPathPoints(rows, rungs, startCol) {
    var pos = startCol;
    var points = [{ x: pos, y: 0 }];
    for (var r = 0; r < rows; r++) {
      var moveRight = rungs.some(function (rg) { return rg.row === r && rg.col === pos; });
      var moveLeft = rungs.some(function (rg) { return rg.row === r && rg.col === pos - 1; });
      points.push({ x: pos, y: r + 0.5 });
      if (moveRight) pos += 1;
      else if (moveLeft) pos -= 1;
      points.push({ x: pos, y: r + 0.5 });
    }
    points.push({ x: pos, y: rows });
    return points;
  }

  function amidaEndForStart(rows, rungs, startCol) {
    var points = amidaPathPoints(rows, rungs, startCol);
    return points[points.length - 1].x;
  }

  function amidaPathD(points, colWidth, rowHeight, marginY) {
    return points.map(function (pt, idx) {
      var px = pt.x * colWidth + colWidth / 2;
      var py = marginY + pt.y * rowHeight;
      return (idx === 0 ? 'M' : 'L') + px + ',' + py;
    }).join(' ');
  }

  function svgEl(tag) { return document.createElementNS('http://www.w3.org/2000/svg', tag); }

  var amidaAudioCtx = null;
  function getAmidaAudioCtx() {
    if (amidaAudioCtx) return amidaAudioCtx;
    try {
      amidaAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) {
      amidaAudioCtx = null;
    }
    return amidaAudioCtx;
  }
  function playAmidaTones(freqs, step) {
    var ctx = getAmidaAudioCtx();
    if (!ctx) return;
    var t0 = ctx.currentTime;
    freqs.forEach(function (freq, i) {
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      var start = t0 + i * step;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.22, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + step + 0.08);
      osc.connect(gain).connect(ctx.destination);
      osc.start(start);
      osc.stop(start + step + 0.1);
    });
  }
  // Synthesized bugle-style fanfare (saw wave through a low-pass) and a starter's pistol.
  function playBrassFanfare() {
    var ctx = getAmidaAudioCtx();
    if (!ctx) return;
    var t0 = ctx.currentTime + 0.05;
    var seq = [
      [392, 0, 0.16], [392, 0.22, 0.16], [392, 0.44, 0.16], [523.25, 0.66, 0.55],
      [523.25, 1.35, 0.16], [523.25, 1.57, 0.16], [523.25, 1.79, 0.16], [659.25, 2.01, 0.55],
      [392, 2.7, 0.16], [523.25, 2.92, 0.16], [659.25, 3.14, 0.16],
      [523.25, 3.4, 0.9], [659.25, 3.4, 0.9], [783.99, 3.4, 0.9]
    ];
    seq.forEach(function (n) {
      var osc = ctx.createOscillator();
      var lp = ctx.createBiquadFilter();
      var gain = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.value = n[0];
      lp.type = 'lowpass';
      lp.frequency.value = 1800;
      var st = t0 + n[1];
      gain.gain.setValueAtTime(0.0001, st);
      gain.gain.exponentialRampToValueAtTime(0.16, st + 0.04);
      gain.gain.setValueAtTime(0.16, st + n[2] - 0.04);
      gain.gain.exponentialRampToValueAtTime(0.0001, st + n[2] + 0.1);
      osc.connect(lp).connect(gain).connect(ctx.destination);
      osc.start(st);
      osc.stop(st + n[2] + 0.15);
    });
  }
  function playPistol() {
    var ctx = getAmidaAudioCtx();
    if (!ctx) return;
    var t0 = ctx.currentTime;
    var len = Math.floor(ctx.sampleRate * 0.35);
    var buf = ctx.createBuffer(1, len, ctx.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 4);
    var src = ctx.createBufferSource();
    src.buffer = buf;
    var hp = ctx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 700;
    var g = ctx.createGain();
    g.gain.value = 0.9;
    src.connect(hp).connect(g).connect(ctx.destination);
    src.start(t0);
    var o = ctx.createOscillator();
    var og = ctx.createGain();
    o.frequency.setValueAtTime(220, t0);
    o.frequency.exponentialRampToValueAtTime(45, t0 + 0.18);
    og.gain.setValueAtTime(0.7, t0);
    og.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.22);
    o.connect(og).connect(ctx.destination);
    o.start(t0);
    o.stop(t0 + 0.25);
  }
  function playKick(vol) {
    var ctx = getAmidaAudioCtx();
    if (!ctx) return;
    var t0 = ctx.currentTime;
    var o = ctx.createOscillator();
    var g = ctx.createGain();
    o.frequency.setValueAtTime(140, t0);
    o.frequency.exponentialRampToValueAtTime(40, t0 + 0.14);
    g.gain.setValueAtTime(vol || 0.5, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.2);
    o.connect(g).connect(ctx.destination);
    o.start(t0);
    o.stop(t0 + 0.22);
  }
  function playRiser(sec) {
    var ctx = getAmidaAudioCtx();
    if (!ctx) return;
    var t0 = ctx.currentTime;
    var o = ctx.createOscillator();
    var lp = ctx.createBiquadFilter();
    var g = ctx.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(180, t0);
    o.frequency.exponentialRampToValueAtTime(1400, t0 + sec);
    lp.type = 'lowpass';
    lp.frequency.value = 2200;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.14, t0 + sec * 0.9);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + sec + 0.08);
    o.connect(lp).connect(g).connect(ctx.destination);
    o.start(t0);
    o.stop(t0 + sec + 0.1);
  }
  function playCrash() {
    var ctx = getAmidaAudioCtx();
    if (!ctx) return;
    var t0 = ctx.currentTime;
    var len = Math.floor(ctx.sampleRate * 1.6);
    var buf = ctx.createBuffer(1, len, ctx.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.5);
    var src = ctx.createBufferSource();
    src.buffer = buf;
    var hp = ctx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 5000;
    var g = ctx.createGain();
    g.gain.value = 0.5;
    src.connect(hp).connect(g).connect(ctx.destination);
    src.start(t0);
  }
  // Crowd noise that swells while the race runs; returns { level(x), stop(burst) }.
  function startCrowd() {
    var ctx = getAmidaAudioCtx();
    if (!ctx) return null;
    var len = ctx.sampleRate * 2;
    var buf = ctx.createBuffer(1, len, ctx.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    var src = ctx.createBufferSource();
    src.buffer = buf;
    src.loop = true;
    var bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 900;
    bp.Q.value = 0.6;
    var g = ctx.createGain();
    g.gain.value = 0.0001;
    src.connect(bp).connect(g).connect(ctx.destination);
    src.start();
    return {
      level: function (x) { g.gain.setTargetAtTime(0.02 + 0.13 * x, ctx.currentTime, 0.25); },
      stop: function (burst) {
        var t = ctx.currentTime;
        if (burst) { g.gain.setTargetAtTime(0.32, t, 0.05); g.gain.setTargetAtTime(0.0001, t + 1.2, 0.5); }
        else g.gain.setTargetAtTime(0.0001, t, 0.15);
        setTimeout(function () { try { src.stop(); } catch (e) {} }, 3500);
      }
    };
  }
  function playAtariChime() { playAmidaTones([523.25, 659.25, 783.99, 1046.5], 0.14); }
  function playHazureBlip() { playAmidaTones([349.23, 293.66], 0.12); }

  var amidaBannerTimer = null;
  function showAmidaBanner(text) {
    if (amidaBannerTimer) { clearTimeout(amidaBannerTimer.hide); clearTimeout(amidaBannerTimer.finish); }
    amidaBanner.textContent = text;
    amidaBanner.hidden = false;
    amidaBanner.classList.remove('show');
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { amidaBanner.classList.add('show'); });
    });
    var hide = setTimeout(function () { amidaBanner.classList.remove('show'); }, 2300);
    var finish = setTimeout(function () { amidaBanner.hidden = true; }, 2600);
    amidaBannerTimer = { hide: hide, finish: finish };
  }

  function amidaSlotColor(i) { return AMIDA_COLORS[i % AMIDA_COLORS.length]; }
  function amidaCols(amida) { return amida.phase === 'picking' ? amida.slots : amida.columns; }

  // Shrink the lanes so the whole ladder fits the card instead of scrolling.
  function fitAmidaWidth(n) {
    var avail = amidaScrollEl.clientWidth || 320;
    var pc = avail >= 700;
    AMIDA_ROW_H = pc ? 20 : 14;
    AMIDA_COL_WIDTH = Math.max(AMIDA_COL_MIN, Math.min(pc ? 90 : 56, Math.floor(avail / n)));
    amidaScrollEl.style.setProperty('--col-w', AMIDA_COL_WIDTH + 'px');
    amidaScrollEl.classList.toggle('narrow', AMIDA_COL_WIDTH < 44);
  }

  function drawAmidaBoard(amida, intro) {
    fitAmidaWidth(amidaCols(amida).length);
    var picking = amida.phase === 'picking';
    var cols = amidaCols(amida);
    var n = cols.length;
    var w = n * AMIDA_COL_WIDTH;
    var hgt = AMIDA_MARGIN_Y * 2 + amida.rows * AMIDA_ROW_H;
    amidaSvg.setAttribute('viewBox', '0 0 ' + w + ' ' + hgt);
    amidaSvg.setAttribute('width', w);
    amidaSvg.setAttribute('height', hgt);
    var html = '';
    for (var i = 0; i < n; i++) {
      var x = i * AMIDA_COL_WIDTH + AMIDA_COL_WIDTH / 2;
      html += '<line class="amida-line" style="stroke-width:3" x1="' + x + '" y1="' + AMIDA_MARGIN_Y + '" x2="' + x + '" y2="' + (AMIDA_MARGIN_Y + amida.rows * AMIDA_ROW_H) + '"></line>';
    }
    (amida.rungs || []).forEach(function (rg) {
      var y = AMIDA_MARGIN_Y + rg.row * AMIDA_ROW_H + AMIDA_ROW_H / 2;
      var x1 = rg.col * AMIDA_COL_WIDTH + AMIDA_COL_WIDTH / 2;
      var x2 = (rg.col + 1) * AMIDA_COL_WIDTH + AMIDA_COL_WIDTH / 2;
      var byIdx = rg.by ? cols.indexOf(rg.by) : -1;
      var isNew = !picking && !rg.by && intro;
      var style = '';
      if (byIdx >= 0) style += 'stroke:' + amidaSlotColor(byIdx) + ';stroke-width:6;opacity:1;';
      if (isNew) style += 'animation-delay:' + Math.round(rg.row * 28) + 'ms;';
      html += '<line class="amida-rung' + (isNew ? ' amida-rung-new' : '') + '" style="' + style + '" x1="' + x1 + '" y1="' + y + '" x2="' + x2 + '" y2="' + y + '"></line>';
    });
    html += '<g id="amida-hl"></g>';
    amidaSvg.innerHTML = html;
  }

  function drawAmidaNames(amida, popCol) {
    var picking = amida.phase === 'picking';
    amidaNamesRow.innerHTML = amidaCols(amida).map(function (pid, i) {
      if (picking) {
        if (pid === null) return '<div class="open" data-slot="' + i + '">＋選ぶ</div>';
        return '<div class="' + (pid === playerId ? 'mine' : 'taken') + '" data-slot="' + i + '" style="color:' + amidaSlotColor(i) + '">' + escapeHtml(nameForPid(pid)) + '</div>';
      }
      return '<div class="' + (pid === playerId ? 'mine ' : '') + (popCol === i ? 'win-pop' : '') + '" data-col="' + i + '" title="' + escapeHtml(nameForPid(pid)) + '">' + escapeHtml(nameForPid(pid)) + '</div>';
    }).join('');
  }

  function drawAmidaOutcomes(amida, mode) {
    var n = amidaCols(amida).length;
    var html = '';
    for (var i = 0; i < n; i++) {
      if (amida.phase === 'picking') { html += '<div></div>'; continue; }
      if (mode === 'all') {
        var label = amida.labels[i];
        html += '<div class="' + (label === '当たり' ? 'atari' : '') + '">' + escapeHtml(label) + '</div>';
      } else if (mode === 'atari' && i === amida.atariSlot) {
        html += '<div class="spot">当たり</div>';
      } else {
        html += '<div>？</div>';
      }
    }
    amidaOutcomesRow.innerHTML = html;
  }

  function amidaPixelPoints(amida, col) {
    return amidaPathPoints(amida.rows, amida.rungs, col).map(function (pt) {
      return { x: pt.x * AMIDA_COL_WIDTH + AMIDA_COL_WIDTH / 2, y: AMIDA_MARGIN_Y + pt.y * AMIDA_ROW_H };
    });
  }

  function drawAmidaFinalPath(amida) {
    var hl = amidaSvg.querySelector('#amida-hl');
    if (!hl) return;
    var pts = amidaPixelPoints(amida, amida.winnerCol);
    var path = svgEl('path');
    path.setAttribute('class', 'amida-path');
    path.setAttribute('d', pts.map(function (p, i) { return (i === 0 ? 'M' : 'L') + p.x + ',' + p.y; }).join(' '));
    path.setAttribute('stroke', '#ffb400');
    path.style.strokeWidth = '5';
    hl.appendChild(path);
  }

  function stopAmidaAnim() {
    if (amidaAnimId) cancelAnimationFrame(amidaAnimId);
    amidaAnimId = null;
    amidaAnimating = false;
    amidaScrollEl.classList.remove('climbing');
  }

  // The "当たり発表": a glowing marker climbs the ladder from the 当たり slot
  // at the bottom, slowly, and only the top of the line says who it is.
  function playAmidaReveal(amida) {
    amidaAnimating = true;
    amidaScrollEl.classList.add('climbing');
    drawAmidaBoard(amida, false);
    drawAmidaNames(amida, null);
    drawAmidaOutcomes(amida, 'atari');
    amidaResultsDiv.innerHTML = '';
    amidaRevealBtn.hidden = true;
    amidaAgainBtn.hidden = true;
    amidaCancelBtn.hidden = true;
    amidaPickingStatus.textContent = '';
    amidaHint.className = 'amida-hint big';
    amidaHint.textContent = '当たりは誰だ…？';

    var hl = amidaSvg.querySelector('#amida-hl');
    var pts = amidaPixelPoints(amida, amida.winnerCol).slice().reverse();
    var cum = [0];
    for (var i = 1; i < pts.length; i++) {
      cum.push(cum[i - 1] + Math.abs(pts[i].x - pts[i - 1].x) + Math.abs(pts[i].y - pts[i - 1].y));
    }
    var total = cum[cum.length - 1];
    var horiz = [];
    for (var j = 0; j < pts.length - 1; j++) {
      if (pts[j].x !== pts[j + 1].x) horiz.push(cum[j]);
    }

    var path = svgEl('path');
    path.setAttribute('class', 'amida-path');
    path.setAttribute('d', pts.map(function (p, k) { return (k === 0 ? 'M' : 'L') + p.x + ',' + p.y; }).join(' '));
    path.setAttribute('stroke', '#ffb400');
    path.style.strokeWidth = '6';
    path.style.strokeDasharray = total + ' ' + total;
    path.style.strokeDashoffset = String(total);
    var halo = svgEl('circle');
    halo.setAttribute('r', '16');

  function launchConfetti(durationMs) {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    confettiCanvas.hidden = false;
    confettiCanvas.width = window.innerWidth;

    var colors = ['#ff5a5f', '#ffd23f', '#3bceac', '#4ea8ff', '#c77dff', '#ff9f1c'];
    var parts = [];
    for (var i = 0; i < 160; i++) {
      var fromLeft = i % 2 === 0;
      parts.push({
        x: fromLeft ? -10 : confettiCanvas.width + 10,
        y: confettiCanvas.height * 0.55 + Math.random() * 60,
        vx: (fromLeft ? 1 : -1) * (6 + Math.random() * 9),
        vy: -(9 + Math.random() * 12),
        w: 6 + Math.random() * 7, h: 9 + Math.random() * 8,

    var start = performance.now();
    confettiRunning = true;
    function step(now) {
      var elapsed = now - start;
      ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      parts.forEach(function (p) {
        p.vy += 0.32; p.vx *= 0.992;

        ctx.save();

  }
