<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ダイス対決</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4efe0;
    --surface: #ffffff;
    --surface-2: #eae1c8;
    --ink: #23291f;
    --ink-secondary: #5a6653;
    --felt: #2d6a4f;
    --felt-ink: #eef7f0;
    --accent: #b3121a;
    --accent-ink: #fbeceb;
    --border: rgba(35, 41, 31, 0.14);
    --pip: #23291f;
    --shadow: 0 1px 2px rgba(35, 41, 31, 0.08), 0 8px 24px rgba(35, 41, 31, 0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11221a;
      --surface: #1a3327;
      --surface-2: #1f3d2f;
      --ink: #eef2e9;
      --ink-secondary: #9fb3a2;
      --felt: #4e9575;
      --felt-ink: #0d1f17;
      --accent: #e5636a;
      --accent-ink: #3a0f11;
      --border: rgba(238, 242, 233, 0.14);
      --pip: #eef2e9;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 32px rgba(0, 0, 0, 0.35);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Noto Sans JP", "Hiragino Sans", sans-serif;
    min-height: 100vh;
  }
  .wrap { max-width: 460px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-family: "Zen Maru Gothic", "Noto Sans JP", sans-serif; font-weight: 700; margin: 0; font-size: 26px; letter-spacing: 0.02em; }
  .card { background: var(--surface); border: 0.5px solid var(--border); border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; }
  .header { background: var(--felt); color: var(--felt-ink); padding: 1.5rem 1.5rem 1.25rem; text-align: center; }
  .header p { margin: 0.35rem 0 0; font-size: 13px; opacity: 0.85; }
  .body { padding: 1.5rem; display: flex; flex-direction: column; gap: 1.1rem; }
  label { font-size: 13px; color: var(--ink-secondary); display: block; margin-bottom: 0.4rem; }
  input[type="text"] {
    width: 100%; font-family: inherit; font-size: 16px; padding: 0.7rem 0.85rem;
    border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); color: var(--ink);
  }
  input[type="text"]:focus { outline: 2px solid var(--felt); outline-offset: 1px; }
  input.code-input { text-transform: uppercase; letter-spacing: 0.3em; text-align: center; font-size: 20px; font-weight: 700; }
  button {
    font-family: inherit; font-weight: 700; font-size: 15px; border-radius: 10px;
    border: none; padding: 0.75rem 1rem; cursor: pointer;
  }
  button.primary { background: var(--accent); color: var(--accent-ink); }
  button.primary:active { transform: scale(0.98); }
  button.primary:disabled { opacity: 0.45; cursor: default; transform: none; }
  button.ghost { background: transparent; color: var(--ink-secondary); border: 1px solid var(--border); }
  .divider { display: flex; align-items: center; gap: 0.75rem; color: var(--ink-secondary); font-size: 12px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .err { color: var(--accent); font-size: 13px; min-height: 1em; }
  .room-code-row { display: flex; align-items: center; justify-content: center; gap: 0.6rem; }
  .room-code { font-family: "Zen Maru Gothic", sans-serif; font-size: 28px; letter-spacing: 0.28em; font-variant-numeric: tabular-nums; }
  .copy-btn { background: rgba(255,255,255,0.16); color: var(--felt-ink); font-size: 12px; padding: 0.3rem 0.6rem; }
  .leave-link {
    display: block; margin: 0.6rem auto 0; background: none; border: none;
    font-size: 12px; font-weight: 400; color: var(--felt-ink); opacity: 0.7;
    text-decoration: underline; padding: 2px 4px; cursor: pointer;
  }
  .leave-link:hover { opacity: 1; }

  .dice-stage { display: flex; flex-direction: column; align-items: center; gap: 0.6rem; padding: 0.25rem 0 0.5rem; }
  .big-dice-row { display: flex; gap: 10px; }
  .big-die {
    width: 66px; height: 66px; border-radius: 14px; background: var(--surface);
    border: 2px solid var(--border); display: flex; align-items: center; justify-content: center;
  }
  .big-die-face { width: 68%; height: 68%; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); }
  .big-die-face .pip { width: 10px; height: 10px; }
  .big-die.spinning { animation: tumble 0.28s ease-in-out infinite; }
  .big-die.landed { animation: land 0.4s cubic-bezier(.34,1.56,.64,1); border-color: var(--accent); }
  @keyframes tumble {
    0% { transform: rotate(0deg) scale(1); }
    25% { transform: rotate(-16deg) scale(1.05); }
    50% { transform: rotate(13deg) scale(0.95); }
    75% { transform: rotate(-9deg) scale(1.03); }
    100% { transform: rotate(0deg) scale(1); }
  }
  @keyframes land {
    0% { transform: scale(1.4) rotate(0deg); }
    55% { transform: scale(0.9) rotate(0deg); }
    100% { transform: scale(1) rotate(0deg); }
  }
  .dice-sum { font-family: "Zen Maru Gothic", sans-serif; font-size: 15px; color: var(--ink-secondary); opacity: 0; transition: opacity 0.25s ease; }
  .dice-sum.show { opacity: 1; }
  .dice-sum .val { font-size: 22px; color: var(--accent); font-variant-numeric: tabular-nums; }

  .players { display: flex; flex-direction: column; gap: 0.6rem; max-height: 336px; overflow-y: auto; padding-right: 2px; scrollbar-width: thin; }
  .player-row { display: flex; align-items: center; gap: 0.7rem; padding: 0.6rem 0.75rem; border-radius: 12px; background: var(--surface-2); border: 1px solid transparent; }
  .player-row.me { border-color: var(--felt); }
  .player-row.winner { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface-2)); }
  .player-row.spectator { opacity: 0.5; }
  .dice-trio { display: flex; gap: 4px; flex-shrink: 0; }
  .player-name { flex: 1; font-size: 15px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .player-name .you-tag { font-size: 11px; color: var(--ink-secondary); font-weight: 400; margin-left: 0.35em; }
  .player-name .out-tag { font-size: 11px; color: var(--ink-secondary); font-weight: 400; margin-left: 0.35em; }
  .sum-badge { font-family: "Zen Maru Gothic", sans-serif; font-size: 18px; font-weight: 700; min-width: 30px; text-align: right; font-variant-numeric: tabular-nums; }
  .die { width: 26px; height: 26px; border-radius: 6px; background: var(--surface); border: 1px solid var(--border); display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); padding: 4px; flex-shrink: 0; }
  .die.empty { opacity: 0.35; }
  .die:not(.empty) { animation: die-pop 0.28s cubic-bezier(.34,1.56,.64,1); }
  @keyframes die-pop { 0% { transform: scale(0.55); } 100% { transform: scale(1); } }
  .die .pip { width: 3.5px; height: 3.5px; }
  .pip { border-radius: 50%; margin: auto; background: transparent; }
  .pip.on { background: var(--pip); }
  .status-line { text-align: center; font-size: 14px; color: var(--ink-secondary); min-height: 1.4em; }
  .status-line.winner-text { color: var(--accent); font-weight: 700; font-size: 16px; }
  .actions { display: flex; gap: 0.6rem; }
  .actions button { flex: 1; }
  .footnote { text-align: center; font-size: 12px; color: var(--ink-secondary); }

  .game-tabs { display: flex; gap: 6px; background: var(--surface-2); border-radius: 12px; padding: 4px; margin-bottom: 1rem; }
  .game-tab {
    flex: 1; background: transparent; color: var(--ink-secondary); font-weight: 700; font-size: 13px;
    padding: 0.5rem 0.4rem; border-radius: 9px;
  }
  .game-tab.active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

  textarea {
    width: 100%; font-family: inherit; font-size: 14px; padding: 0.6rem 0.7rem; resize: vertical;
    border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); color: var(--ink);
  }
  textarea:focus { outline: 2px solid var(--felt); outline-offset: 1px; }

  .amida-slots { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 0.8rem; }
  .amida-slot {
    flex: 1 1 72px; min-width: 72px; padding: 0.55rem 0.4rem; border-radius: 10px;
    background: var(--surface-2); border: 1px solid var(--border); text-align: center;
    font-size: 13px; cursor: pointer; overflow: hidden;
  }
  .amida-slot .num { display: block; font-size: 11px; color: var(--ink-secondary); margin-bottom: 2px; }
  .amida-slot .who { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .amida-slot.taken { background: color-mix(in srgb, var(--felt) 15%, var(--surface-2)); border-color: var(--felt); }
  .amida-slot.mine { border-color: var(--accent); font-weight: 700; }
  .amida-slot.blocked { cursor: default; opacity: 0.85; }

  .amida-scroll { overflow-x: auto; padding-bottom: 4px; margin-bottom: 0.8rem; }
  .amida-row { display: flex; }
  .amida-row > div {
    width: 56px; flex-shrink: 0; text-align: center; font-size: 12px; color: var(--ink-secondary);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 2px;
  }
  .amida-row > div.me { color: var(--felt); font-weight: 700; }
  #amida-svg { display: block; }
  .amida-line { stroke: var(--ink-secondary); stroke-width: 2; opacity: 0.5; }
  .amida-path { fill: none; stroke-width: 3; stroke-linecap: round; opacity: 0.9; }

  .amida-results { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 0.8rem; max-height: 300px; overflow-y: auto; }
  .amida-result-row {
    display: flex; align-items: center; gap: 0.7rem; padding: 0.55rem 0.75rem; border-radius: 12px;
    background: var(--surface-2); border: 1px solid transparent; cursor: default;
  }
  .amida-result-row.clickable { cursor: pointer; }
  #amida-outcomes > div { cursor: pointer; }
  .amida-result-row.me { border-color: var(--felt); }
  .amida-result-row.highlighted { border-color: var(--result-color, var(--accent)); }
  .amida-result-swatch { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; background: var(--ink-secondary); }
  .amida-result-name { flex: 1; font-size: 15px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .amida-result-name .tag { font-size: 11px; color: var(--felt); font-weight: 700; margin-left: 0.35em; }
  .amida-result-label { font-weight: 700; font-size: 14px; max-width: 40%; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .amida-result-row.atari { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, var(--surface-2)); }
  .amida-result-row.atari .amida-result-label { color: var(--accent); font-size: 16px; }
  #amida-outcomes > div.atari { color: var(--accent); font-weight: 700; }

  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) {
    .big-die.spinning, .big-die.landed, .die:not(.empty) { animation: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <section id="entry" class="card">
    <div class="header">
      <h1>🎲 ダイス対決</h1>
      <p>3つの合計が一番大きい人の勝ち</p>
    </div>
    <div class="body">
      <div>
        <label for="name-input">あなたの名前</label>
        <input type="text" id="name-input" maxlength="16" placeholder="例）けんじ" autocomplete="off">
      </div>
      <button class="primary" id="create-btn">部屋を作る</button>
      <div class="divider">または</div>
      <div>
        <label for="code-input">合言葉（部屋コード）</label>
        <input type="text" id="code-input" class="code-input" maxlength="4" placeholder="ABCD" autocomplete="off">
      </div>
      <button class="ghost" id="join-btn">この部屋に入る</button>
      <div class="err" id="entry-err"></div>
    </div>
  </section>

  <section id="room" class="card" hidden>
    <div class="header">
      <p style="margin:0 0 0.4rem;">合言葉を友達に伝えよう</p>
      <div class="room-code-row">
        <span class="room-code" id="room-code-display">----</span>
        <button class="copy-btn" id="copy-btn" type="button">コピー</button>
      </div>
      <button class="leave-link" id="leave-btn" type="button">退出する</button>
    </div>
    <div class="body">
      <div class="game-tabs">
        <button class="game-tab" id="tab-dice" data-game="dice" type="button">🎲 ダイス対決</button>
        <button class="game-tab" id="tab-amida" data-game="amida" type="button">🪜 あみだくじ</button>
      </div>

      <div id="dice-game">
        <div class="dice-stage" id="dice-stage" hidden>
          <div class="big-dice-row">
            <div class="big-die" id="big-die-0"><div class="big-die-face" id="big-die-face-0"></div></div>
            <div class="big-die" id="big-die-1"><div class="big-die-face" id="big-die-face-1"></div></div>
            <div class="big-die" id="big-die-2"><div class="big-die-face" id="big-die-face-2"></div></div>
          </div>
          <div class="dice-sum" id="dice-sum">合計 <span class="val" id="dice-sum-val">0</span></div>
        </div>
        <div class="players" id="players-list"></div>
        <div class="status-line" id="status-line"></div>
        <div class="actions">
          <button class="primary" id="roll-btn">サイコロを振る</button>
          <button class="ghost" id="next-round-btn" hidden>もう一度</button>
        </div>
      </div>

      <div id="amida-game" hidden>
        <div id="amida-setup">
          <label for="amida-slot-count">参加人数</label>
          <input type="text" inputmode="numeric" id="amida-slot-count" style="max-width:100px; margin-bottom:0.8rem;" value="2">
          <label for="amida-labels-input">結果の項目（1行1つ、空欄なら自動で番号になります）</label>
          <textarea id="amida-labels-input" rows="4" placeholder="当たり&#10;はずれ&#10;はずれ"></textarea>
          <div class="footnote" style="margin: 0.4rem 0 0.8rem;">参加人数と行数が違う場合は自動で「当たり」1人＋「はずれ」になります。</div>
          <button class="primary" id="amida-start-btn">スタート位置を選ぶ</button>
          <div class="err" id="amida-err"></div>
        </div>
        <div id="amida-picking" hidden>
          <div class="footnote" style="margin-bottom:0.6rem;">好きなスタート位置をタップしてください。もう一度タップすると取り消せます。</div>
          <div class="amida-slots" id="amida-slots"></div>
          <div class="status-line" id="amida-picking-status"></div>
          <div class="actions">
            <button class="primary" id="amida-begin-btn" disabled>あみだくじスタート</button>
            <button class="ghost" id="amida-cancel-btn">やめる</button>
          </div>
        </div>
        <div id="amida-ladder-wrap" hidden>
          <div class="amida-scroll">
            <div class="amida-row" id="amida-names"></div>
            <svg id="amida-svg"></svg>
            <div class="amida-row" id="amida-outcomes"></div>
          </div>
          <div class="amida-results" id="amida-results"></div>
          <div class="actions">
            <button class="primary" id="amida-reveal-btn">結果を見る</button>
            <button class="ghost" id="amida-reveal-all-btn" hidden>全員の結果を見る</button>
            <button class="ghost" id="amida-again-btn" hidden>もう一度くじを作る</button>
          </div>
          <div class="err" id="amida-run-err"></div>
        </div>
      </div>

      <div class="footnote">このブラウザがあなたの席です。他の人は同じ合言葉で参加してください。</div>
    </div>
  </section>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
(function () {
  var PIP_MAP = {
    1: [5], 2: [1, 9], 3: [1, 5, 9], 4: [1, 3, 7, 9],
    5: [1, 3, 5, 7, 9], 6: [1, 3, 4, 6, 7, 9]
  };

  function pipsHTML(value) {
    var on = value ? PIP_MAP[value] : [];
    var cells = '';
    for (var i = 1; i <= 9; i++) {
      cells += '<span class="pip' + (on.indexOf(i) !== -1 ? ' on' : '') + '"></span>';
    }
    return cells;
  }
  function dieFaceHTML(value) {
    return '<div class="die' + (value ? '' : ' empty') + '">' + pipsHTML(value) + '</div>';
  }
  function trioHTML(values) {
    values = values || [null, null, null];
    return '<div class="dice-trio">' + values.map(dieFaceHTML).join('') + '</div>';
  }
  function randomFace() { return 1 + Math.floor(Math.random() * 6); }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function getPlayerId() {
    var id = localStorage.getItem('dice_player_id');
    if (!id) {
      id = 'p_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
      localStorage.setItem('dice_player_id', id);
    }
    return id;
  }

  var playerId = getPlayerId();
  var nameInput = document.getElementById('name-input');
  var codeInput = document.getElementById('code-input');
  var createBtn = document.getElementById('create-btn');
  var joinBtn = document.getElementById('join-btn');
  var entryErr = document.getElementById('entry-err');
  var entrySection = document.getElementById('entry');
  var roomSection = document.getElementById('room');
  var roomCodeDisplay = document.getElementById('room-code-display');
  var copyBtn = document.getElementById('copy-btn');
  var leaveBtn = document.getElementById('leave-btn');
  var playersList = document.getElementById('players-list');
  var statusLine = document.getElementById('status-line');
  var rollBtn = document.getElementById('roll-btn');
  var nextRoundBtn = document.getElementById('next-round-btn');
  var diceStage = document.getElementById('dice-stage');
  var diceSum = document.getElementById('dice-sum');
  var diceSumVal = document.getElementById('dice-sum-val');
  var bigDieEls = [
    { die: document.getElementById('big-die-0'), face: document.getElementById('big-die-face-0') },
    { die: document.getElementById('big-die-1'), face: document.getElementById('big-die-face-1') },
    { die: document.getElementById('big-die-2'), face: document.getElementById('big-die-face-2') }
  ];

  var tabDice = document.getElementById('tab-dice');
  var tabAmida = document.getElementById('tab-amida');
  var diceGameDiv = document.getElementById('dice-game');
  var amidaGameDiv = document.getElementById('amida-game');
  var amidaSetupDiv = document.getElementById('amida-setup');
  var amidaSlotCountInput = document.getElementById('amida-slot-count');
  var amidaLabelsInput = document.getElementById('amida-labels-input');
  var amidaStartBtn = document.getElementById('amida-start-btn');
  var amidaErr = document.getElementById('amida-err');
  var amidaPickingDiv = document.getElementById('amida-picking');
  var amidaSlotsDiv = document.getElementById('amida-slots');
  var amidaPickingStatus = document.getElementById('amida-picking-status');
  var amidaBeginBtn = document.getElementById('amida-begin-btn');
  var amidaCancelBtn = document.getElementById('amida-cancel-btn');
  var amidaLadderWrap = document.getElementById('amida-ladder-wrap');
  var amidaNamesRow = document.getElementById('amida-names');
  var amidaSvg = document.getElementById('amida-svg');
  var amidaOutcomesRow = document.getElementById('amida-outcomes');
  var amidaResultsDiv = document.getElementById('amida-results');
  var amidaRevealBtn = document.getElementById('amida-reveal-btn');
  var amidaRevealAllBtn = document.getElementById('amida-reveal-all-btn');
  var amidaAgainBtn = document.getElementById('amida-again-btn');
  var amidaRunErr = document.getElementById('amida-run-err');

  var AMIDA_COLORS = ['#c1440e', '#1d6fa5', '#8a5cb5', '#c2185b', '#2e8b57', '#b8860b', '#5c6bc0', '#00838f'];
  var AMIDA_COL_WIDTH = 56;
  var AMIDA_MARGIN_Y = 10;
  var amidaHighlightCol = null;
  // Local-only "have we actually shown this on screen yet" state, so a
  // player's result only appears once their trace animation has played —
  // even though the server already told us the moment it was traced.
  var amidaSessionId = null;
  var amidaKnownRevealed = {};
  var amidaAnimQueue = [];
  var amidaAnimatingCol = null;
  var amidaRowHeight = 10;
  var amidaBaseLayer = null;
  var amidaHighlightLayerEl = null;
  var amidaSlotCountInitialized = false;

  nameInput.value = localStorage.getItem('dice_name') || '';

  var socket = io();
  var latestData = null;
  var isRolling = false;
  var isConnected = false;
  // The room+name we should be in. Re-sent on every 'connect' (including
  // reconnects after a dropped connection), so a lost join/roll never
  // leaves the player stuck with an unresponsive button.
  var desired = null;
  var pendingCreateName = null;

  function setErr(msg) { entryErr.textContent = msg || ''; }

  var disconnectDebounce = null;

  function setConnUI() {
    var busy = !isConnected;
    createBtn.disabled = busy || !!pendingCreateName;
    joinBtn.disabled = busy;
    render();
  }

  socket.on('connect', function () {
    if (disconnectDebounce) { clearTimeout(disconnectDebounce); disconnectDebounce = null; }
    isConnected = true;
    setConnUI();
    if (desired) {
      socket.emit('join_room', { code: desired.code, name: desired.name, pid: playerId });
    } else if (pendingCreateName) {
      socket.emit('create_room', { name: pendingCreateName, pid: playerId });
    }
  });

  socket.on('disconnect', function () {
    isConnected = false;
    // A reconnect during a Render cold start (or any brief network blip)
    // can flap connect/disconnect a few times in quick succession. Wait a
    // moment before showing the "disconnected" UI so a fast recovery never
    // reads as the buttons flickering.
    if (disconnectDebounce) clearTimeout(disconnectDebounce);
    disconnectDebounce = setTimeout(function () {
      disconnectDebounce = null;
      setConnUI();
    }, 400);
  });

  socket.on('joined', function (payload) {
    pendingCreateName = null;
    desired = { code: payload.code, name: nameInput.value.trim() || localStorage.getItem('dice_name') || '' };
    localStorage.setItem('dice_room_code', payload.code);
    roomCodeDisplay.textContent = payload.code;
    entrySection.hidden = true;
    roomSection.hidden = false;
    createBtn.disabled = false;
    joinBtn.disabled = false;
  });

  function backToEntry(message) {
    desired = null;
    pendingCreateName = null;
    latestData = null;
    localStorage.removeItem('dice_room_code');
    roomSection.hidden = true;
    entrySection.hidden = false;
    createBtn.disabled = false;
    joinBtn.disabled = false;
    setErr(message);
  }

  socket.on('join_error', function (e) {
    createBtn.disabled = false;
    joinBtn.disabled = false;
    pendingCreateName = null;
    if (e.code === 'not_found') {
      // Whether this was a manual join or a silent auto-rejoin after a
      // reconnect, the room is gone — always return to a working entry
      // screen instead of leaving a stale/frozen room view on screen.
      backToEntry('前回の部屋は見つかりませんでした。もう一度部屋を作るか、合言葉を入力してください。');
    } else {
      setErr('通信に失敗しました。');
    }
  });

  socket.on('state', function (data) {
    latestData = data;
    render();
  });

  socket.on('connect_error', function () {
    isConnected = false;
    if (disconnectDebounce) clearTimeout(disconnectDebounce);
    disconnectDebounce = setTimeout(function () {
      disconnectDebounce = null;
      setConnUI();
    }, 400);
  });

  function render() {
    if (!isConnected) {
      if (latestData) {
        statusLine.className = 'status-line';
        statusLine.textContent = '接続が切れました。再接続しています…';
        rollBtn.hidden = true;
        nextRoundBtn.hidden = true;
      }
      return;
    }
    if (!latestData) return;

    var game = latestData.game || 'dice';
    tabDice.classList.toggle('active', game === 'dice');
    tabAmida.classList.toggle('active', game === 'amida');
    diceGameDiv.hidden = game !== 'dice';
    amidaGameDiv.hidden = game !== 'amida';

    renderDice();
    renderAmida();
  }

  function renderDice() {
    var round = latestData.round || 1;
    var players = latestData.players || [];
    var rolls = latestData.rolls || {};
    var activeIds = latestData.activeIds || null;

    var rows = players.map(function (p) {
      var r = rolls[p.id];
      var hasCurrent = r && r.round === round;
      var isActive = !activeIds || activeIds.indexOf(p.id) !== -1;
      return {
        pid: p.id, name: p.name,
        values: hasCurrent ? r.values : null,
        sum: hasCurrent ? r.sum : null,
        active: isActive
      };
    });

    var activeRows = rows.filter(function (r) { return r.active; });
    var allRolled = activeRows.length > 0 && activeRows.every(function (r) { return r.sum !== null; });
    var maxSum = allRolled ? Math.max.apply(null, activeRows.map(function (r) { return r.sum; })) : null;
    var winners = allRolled ? activeRows.filter(function (r) { return r.sum === maxSum; }) : [];
    var isTie = winners.length > 1;

    playersList.innerHTML = rows.map(function (r) {
      var isMe = r.pid === playerId;
      var isWinner = allRolled && !isTie && r.active && r.sum === maxSum;
      var cls = 'player-row' + (isMe ? ' me' : '') + (isWinner ? ' winner' : '') + (!r.active ? ' spectator' : '');
      var tag = isMe ? '<span class="you-tag">あなた</span>' : (!r.active ? '<span class="out-tag">見学中</span>' : '');
      return '<div class="' + cls + '">' +
        trioHTML(r.values) +
        '<div class="player-name">' + escapeHtml(r.name) + tag + '</div>' +
        '<div class="sum-badge">' + (r.sum !== null ? r.sum : '–') + '</div>' +
        '</div>';
    }).join('');

    if (activeRows.length === 0) {
      statusLine.className = 'status-line';
      statusLine.textContent = '参加者を待っています…';
    } else if (!allRolled) {
      var remaining = activeRows.filter(function (r) { return r.sum === null; }).length;
      statusLine.className = 'status-line';
      statusLine.textContent = (activeIds ? '同点対決！あと' : 'あと') + remaining + '人がサイコロを振るのを待っています…';
    } else if (isTie) {
      statusLine.className = 'status-line winner-text';
      statusLine.textContent = '同点！（' + winners.map(function (w) { return w.name; }).join('・') + '）1位同士で振り直し';
    } else {
      statusLine.className = 'status-line winner-text';
      statusLine.textContent = winners[0].name + ' の勝ち！（合計 ' + maxSum + '）';
    }

    if (!isRolling) {
      var myRow = rows.filter(function (r) { return r.pid === playerId; })[0];
      if (myRow && !myRow.active) {
        rollBtn.hidden = true;
      } else {
        rollBtn.hidden = false;
        var myRolledThisRound = myRow && myRow.sum !== null;
        rollBtn.disabled = !!myRolledThisRound;
        rollBtn.textContent = myRolledThisRound ? '振った！次を待とう' : 'サイコロを振る';
      }
    }
    nextRoundBtn.hidden = !allRolled;
    nextRoundBtn.textContent = isTie ? '同点者で振り直す' : '新しいゲーム';
  }

  function nameForPid(pid) {
    var p = (latestData.players || []).find(function (x) { return x.id === pid; });
    return p ? p.name : '(退出済み)';
  }

  // Full top-to-bottom route for startCol, alternating "just above a rung
  // row" / "just below it" points so the drawn line visibly steps sideways
  // exactly where a real rung is crossed.
  function amidaPathPoints(rows, rungs, startCol) {
    var pos = startCol;
    var points = [{ x: pos, y: 0 }];
    for (var r = 0; r < rows; r++) {
      var moveRight = rungs.some(function (rg) { return rg.row === r && rg.col === pos; });
      var moveLeft = rungs.some(function (rg) { return rg.row === r && rg.col === pos - 1; });
      points.push({ x: pos, y: r + 0.5 });
      if (moveRight) pos += 1;
      else if (moveLeft) pos -= 1;
      points.push({ x: pos, y: r + 0.5 });
    }
    points.push({ x: pos, y: rows });
    return points;
  }

  function amidaEndForStart(rows, rungs, startCol) {
    var points = amidaPathPoints(rows, rungs, startCol);
    return points[points.length - 1].x;
  }

  function amidaPathD(points, colWidth, rowHeight, marginY) {
    return points.map(function (pt, idx) {
      var px = pt.x * colWidth + colWidth / 2;
      var py = marginY + pt.y * rowHeight;
      return (idx === 0 ? 'M' : 'L') + px + ',' + py;
    }).join(' ');
  }

  function svgEl(tag) { return document.createElementNS('http://www.w3.org/2000/svg', tag); }

  function ensureAmidaLayers() {
    if (amidaBaseLayer && amidaBaseLayer.ownerSVGElement === amidaSvg) return;
    amidaSvg.innerHTML = '';
    amidaBaseLayer = svgEl('g');
    amidaHighlightLayerEl = svgEl('g');
    amidaSvg.appendChild(amidaBaseLayer);
    amidaSvg.appendChild(amidaHighlightLayerEl);
  }

  function drawAmidaStaticHighlight(amida, col) {
    amidaHighlightLayerEl.innerHTML = '';
    if (col === null) return;
    var points = amidaPathPoints(amida.rows, amida.rungs, col);
    var d = amidaPathD(points, AMIDA_COL_WIDTH, amidaRowHeight, AMIDA_MARGIN_Y);
    var path = svgEl('path');
    path.setAttribute('class', 'amida-path');
    path.setAttribute('d', d);
    path.setAttribute('stroke', AMIDA_COLORS[col % AMIDA_COLORS.length]);
    amidaHighlightLayerEl.appendChild(path);
  }

  function playAmidaTrace(amida, col) {
    amidaAnimatingCol = col;
    var points = amidaPathPoints(amida.rows, amida.rungs, col).slice().reverse();
    var d = amidaPathD(points, AMIDA_COL_WIDTH, amidaRowHeight, AMIDA_MARGIN_Y);
    var color = AMIDA_COLORS[col % AMIDA_COLORS.length];
    var duration = Math.min(4000, Math.max(1200, amida.rows * 35));

    var path = svgEl('path');
    path.setAttribute('class', 'amida-path');
    path.setAttribute('pathLength', '1');
    path.setAttribute('d', d);
    path.setAttribute('stroke', color);
    path.style.strokeDasharray = '1';
    path.style.strokeDashoffset = '1';
    path.style.transition = 'stroke-dashoffset ' + duration + 'ms linear';

    amidaHighlightLayerEl.innerHTML = '';
    amidaHighlightLayerEl.appendChild(path);

    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        path.style.strokeDashoffset = '0';
      });
    });

    setTimeout(function () {
      amidaKnownRevealed[col] = true;
      amidaAnimatingCol = null;
      amidaHighlightCol = col;
      render();
      processAmidaQueue();
    }, duration + 150);
  }

  function processAmidaQueue() {
    if (amidaAnimatingCol !== null || amidaAnimQueue.length === 0) return;
    var col = amidaAnimQueue.shift();
    if (amidaKnownRevealed[col]) { processAmidaQueue(); return; }
    var amida = latestData.amida;
    if (!amida) return;
    playAmidaTrace(amida, col);
  }

  function requestAmidaTrace(col) {
    var amida = latestData.amida;
    if (!amida || !amida.revealed) return;
    if (amidaKnownRevealed[col]) {
      amidaHighlightCol = (amidaHighlightCol === col) ? null : col;
      render();
      return;
    }
    if (amidaAnimQueue.indexOf(col) !== -1 || amidaAnimatingCol === col) return;
    if (!isConnected) { amidaRunErr.textContent = '接続が切れています。'; return; }
    socket.emit('amida_trace', { col: col });
  }

  function renderAmidaPicking(amida) {
    var players = latestData.players || [];
    var takenCount = amida.slots.filter(function (s) { return s !== null; }).length;

    amidaSlotsDiv.innerHTML = amida.slots.map(function (pid, i) {
      var isMine = pid === playerId;
      var isTaken = pid !== null;
      var cls = 'amida-slot' + (isTaken ? ' taken' : '') + (isMine ? ' mine' : '') + (isTaken && !isMine ? ' blocked' : '');
      var who = isTaken ? escapeHtml(nameForPid(pid)) : '空き';
      return '<div class="' + cls + '" data-slot="' + i + '">' +
        '<span class="num">位置' + (i + 1) + '</span>' +
        '<span class="who">' + who + '</span>' +
        '</div>';
    }).join('');

    amidaPickingStatus.textContent = takenCount + ' / ' + amida.slotCount + '人が選択済み';
    amidaBeginBtn.disabled = takenCount !== amida.slotCount;
  }

  function renderAmida() {
    var amida = latestData.amida;
    amidaSetupDiv.hidden = !!amida;
    amidaPickingDiv.hidden = !amida || amida.phase !== 'picking';
    amidaLadderWrap.hidden = !amida || amida.phase !== 'ladder';

    if (!amida) {
      if (!amidaSlotCountInitialized) {
        amidaSlotCountInitialized = true;
        var suggested = Math.max(2, (latestData.players || []).length);
        amidaSlotCountInput.value = String(suggested);
      }
      return;
    }

    if (amida.phase === 'picking') {
      renderAmidaPicking(amida);
      return;
    }

    if (amida.id !== amidaSessionId) {
      amidaSessionId = amida.id;
      amidaKnownRevealed = {};
      amidaAnimQueue = [];
      amidaAnimatingCol = null;
      amidaHighlightCol = null;
      amidaBaseLayer = null; // force a fresh base-ladder draw below
      amidaRowHeight = amida.rows > 40 ? 10 : (amida.rows > 20 ? 16 : 28);
    }

    var columns = amida.columns;
    var svgWidth = columns.length * AMIDA_COL_WIDTH;
    var svgHeight = AMIDA_MARGIN_Y * 2 + amida.rows * amidaRowHeight;
    amidaSvg.setAttribute('viewBox', '0 0 ' + svgWidth + ' ' + svgHeight);
    amidaSvg.setAttribute('width', svgWidth);
    amidaSvg.setAttribute('height', svgHeight);

    var freshLayers = !amidaBaseLayer;
    ensureAmidaLayers();

    if (freshLayers) {
      amidaNamesRow.innerHTML = columns.map(function (pid) {
        return '<div class="' + (pid === playerId ? 'me' : '') + '">' + escapeHtml(nameForPid(pid)) + '</div>';
      }).join('');

      var lines = [];
      for (var i = 0; i < columns.length; i++) {
        var x = i * AMIDA_COL_WIDTH + AMIDA_COL_WIDTH / 2;
        lines.push('<line class="amida-line" x1="' + x + '" y1="' + AMIDA_MARGIN_Y + '" x2="' + x + '" y2="' + (AMIDA_MARGIN_Y + amida.rows * amidaRowHeight) + '"></line>');
      }
      amida.rungs.forEach(function (rg) {
        var y = AMIDA_MARGIN_Y + rg.row * amidaRowHeight + amidaRowHeight / 2;
        var x1 = rg.col * AMIDA_COL_WIDTH + AMIDA_COL_WIDTH / 2;
        var x2 = (rg.col + 1) * AMIDA_COL_WIDTH + AMIDA_COL_WIDTH / 2;
        lines.push('<line class="amida-line" x1="' + x1 + '" y1="' + y + '" x2="' + x2 + '" y2="' + y + '"></line>');
      });
      amidaBaseLayer.innerHTML = lines.join('');
    }

    // Queue up anything the server says has been traced (by anyone) that
    // we haven't actually played the reveal animation for yet. A single
    // new column plays the suspenseful climb; several appearing at once
    // (the "reveal everyone" button) skip straight to known — no point
    // queueing a dozen animations back to back.
    var newlyRevealed = amida.revealed
      ? amida.revealedCols.filter(function (c) { return !amidaKnownRevealed[c] && amidaAnimQueue.indexOf(c) === -1 && amidaAnimatingCol !== c; })
      : [];
    if (newlyRevealed.length > 1) {
      newlyRevealed.forEach(function (c) { amidaKnownRevealed[c] = true; });
    } else if (newlyRevealed.length === 1) {
      amidaAnimQueue.push(newlyRevealed[0]);
    }

    if (amidaAnimatingCol === null) {
      if (amidaAnimQueue.length > 0) {
        processAmidaQueue();
      } else {
        drawAmidaStaticHighlight(amida, amidaHighlightCol);
      }
    }

    // The bottom row is the FIXED slot at the foot of each ladder column —
    // it never depends on whether any particular player's trace has
    // played yet, so it can show as soon as the ladder itself is revealed.
    amidaOutcomesRow.innerHTML = amida.labels.map(function (label) {
      var isAtari = label.trim() === '当たり';
      return '<div class="' + (amida.revealed && isAtari ? 'atari' : '') + '">' + (amida.revealed ? escapeHtml(label) : '？') + '</div>';
    }).join('');

    amidaResultsDiv.innerHTML = columns.map(function (pid, i) {
      var isMe = pid === playerId;
      var isKnown = !!amidaKnownRevealed[i];
      var isHighlighted = amidaHighlightCol === i;
      var label = isKnown ? amida.resultsByPid[pid] : '？';
      var isAtari = isKnown && label.trim() === '当たり';
      var cls = 'amida-result-row' + (amida.revealed ? ' clickable' : '') + (isMe ? ' me' : '') + (isHighlighted ? ' highlighted' : '') + (isAtari ? ' atari' : '');
      var swatchColor = isKnown ? AMIDA_COLORS[i % AMIDA_COLORS.length] : '';
      var style = swatchColor ? ' style="--result-color:' + swatchColor + '"' : '';
      var swatch = '<span class="amida-result-swatch"' + (swatchColor ? ' style="background:' + swatchColor + '"' : '') + '></span>';
      var labelText = (isAtari ? '🎉 ' : '') + label;
      return '<div class="' + cls + '" data-col="' + i + '"' + style + '>' +
        swatch +
        '<span class="amida-result-name">' + escapeHtml(nameForPid(pid)) + (isMe ? '<span class="tag">あなた</span>' : '') + '</span>' +
        '<span class="amida-result-label">' + escapeHtml(labelText) + '</span>' +
        '</div>';
    }).join('');

    var allKnown = columns.every(function (_, i) { return amidaKnownRevealed[i]; });
    amidaRevealBtn.hidden = amida.revealed;
    amidaRevealAllBtn.hidden = !amida.revealed || allKnown;
    amidaAgainBtn.hidden = !amida.revealed;
  }

  tabDice.addEventListener('click', function () {
    if (isConnected) socket.emit('switch_game', { game: 'dice' });
  });
  tabAmida.addEventListener('click', function () {
    if (isConnected) socket.emit('switch_game', { game: 'amida' });
  });

  amidaStartBtn.addEventListener('click', function () {
    if (!isConnected) { amidaErr.textContent = '接続が切れています。'; return; }
    var slotCount = Math.round(Number(amidaSlotCountInput.value));
    if (!slotCount || slotCount < 2 || slotCount > 30) {
      amidaErr.textContent = '参加人数は2〜30人で入力してください。';
      return;
    }
    var lines = amidaLabelsInput.value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
    amidaErr.textContent = '';
    socket.emit('amida_setup', { labels: lines, slotCount: slotCount });
  });

  amidaSlotsDiv.addEventListener('click', function (e) {
    var el = e.target.closest('.amida-slot');
    if (!el) return;
    var amida = latestData && latestData.amida;
    if (!amida || amida.phase !== 'picking') return;
    var idx = parseInt(el.getAttribute('data-slot'), 10);
    var heldBy = amida.slots[idx];
    if (heldBy && heldBy !== playerId) return;
    if (!isConnected) return;
    socket.emit('amida_pick_slot', { slot: idx });
  });

  amidaBeginBtn.addEventListener('click', function () {
    if (!isConnected) return;
    socket.emit('amida_begin');
  });

  amidaCancelBtn.addEventListener('click', function () {
    if (!isConnected) return;
    socket.emit('amida_reset');
  });

  amidaRevealBtn.addEventListener('click', function () {
    if (!isConnected) { amidaRunErr.textContent = '接続が切れています。'; return; }
    socket.emit('amida_reveal');
  });

  amidaRevealAllBtn.addEventListener('click', function () {
    if (!isConnected) { amidaRunErr.textContent = '接続が切れています。'; return; }
    socket.emit('amida_reveal_all');
  });

  amidaAgainBtn.addEventListener('click', function () {
    if (!isConnected) { amidaRunErr.textContent = '接続が切れています。'; return; }
    socket.emit('amida_reset');
  });

  amidaResultsDiv.addEventListener('click', function (e) {
    var row = e.target.closest('.amida-result-row.clickable');
    if (!row) return;
    requestAmidaTrace(parseInt(row.getAttribute('data-col'), 10));
  });

  amidaOutcomesRow.addEventListener('click', function (e) {
    var amida = latestData && latestData.amida;
    if (!amida || !amida.revealed) return;
    var cell = e.target.closest('div');
    if (!cell || cell.parentNode !== amidaOutcomesRow) return;
    var slotIndex = Array.prototype.indexOf.call(amidaOutcomesRow.children, cell);
    for (var i = 0; i < amida.columns.length; i++) {
      if (amidaEndForStart(amida.rows, amida.rungs, i) === slotIndex) { requestAmidaTrace(i); break; }
    }
  });

  createBtn.addEventListener('click', function () {
    var name = nameInput.value.trim();
    if (!name) { setErr('名前を入力してください。'); return; }
    setErr('');
    localStorage.setItem('dice_name', name);
    createBtn.disabled = true;
    desired = null;
    pendingCreateName = name;
    socket.emit('create_room', { name: name, pid: playerId });
  });

  joinBtn.addEventListener('click', function () {
    var name = nameInput.value.trim();
    var code = codeInput.value.trim().toUpperCase();
    if (!name) { setErr('名前を入力してください。'); return; }
    if (code.length !== 4) { setErr('4文字の合言葉を入力してください。'); return; }
    setErr('');
    localStorage.setItem('dice_name', name);
    joinBtn.disabled = true;
    pendingCreateName = null;
    desired = { code: code, name: name };
    socket.emit('join_room', { code: code, name: name, pid: playerId });
  });

  rollBtn.addEventListener('click', function () {
    if (!latestData || isRolling) return;
    if (!isConnected) { statusLine.textContent = '接続が切れています。再接続を待ってからもう一度お試しください。'; return; }
    var round = latestData.round || 1;
    var activeIds = latestData.activeIds || null;
    if (activeIds && activeIds.indexOf(playerId) === -1) return;
    var myRoll = latestData.rolls && latestData.rolls[playerId];
    if (myRoll && myRoll.round === round) return;

    isRolling = true;
    rollBtn.disabled = true;
    rollBtn.textContent = '振っています…';
    diceStage.hidden = false;
    diceSum.classList.remove('show');

    bigDieEls.forEach(function (el) {
      el.die.className = 'big-die spinning';
      el.face.innerHTML = pipsHTML(randomFace());
    });

    var startedAt = Date.now();
    var flickerTimer = setInterval(function () {
      bigDieEls.forEach(function (el) {
        el.face.innerHTML = pipsHTML(randomFace());
      });
    }, 80);

    socket.emit('roll');

    var checkTimer = setInterval(function () {
      var elapsed = Date.now() - startedAt;
      var mine = latestData && latestData.rolls && latestData.rolls[playerId];
      var haveResult = mine && mine.round === round;

      if (haveResult && elapsed >= 900) {
        clearInterval(flickerTimer);
        clearInterval(checkTimer);
        settle(mine.values, mine.sum);
      } else if (elapsed > 6000) {
        clearInterval(flickerTimer);
        clearInterval(checkTimer);
        isRolling = false;
        diceStage.hidden = true;
        statusLine.textContent = '通信がタイムアウトしました。もう一度お試しください。';
        render();
      }
    }, 100);

    function settle(values, sum) {
      bigDieEls.forEach(function (el, idx) {
        el.face.innerHTML = pipsHTML(values[idx]);
        el.die.className = 'big-die landed';
      });
      diceSumVal.textContent = sum;
      diceSum.classList.add('show');
      setTimeout(function () {
        diceStage.hidden = true;
        isRolling = false;
        render();
      }, 800);
    }
  });

  nextRoundBtn.addEventListener('click', function () {
    if (!isConnected) { statusLine.textContent = '接続が切れています。再接続を待ってからもう一度お試しください。'; return; }
    socket.emit('next_round');
  });

  leaveBtn.addEventListener('click', function () {
    if (isConnected) socket.emit('leave_room');
    backToEntry('');
  });

  copyBtn.addEventListener('click', function () {
    var code = roomCodeDisplay.textContent;
    if (navigator.clipboard) {
      navigator.clipboard.writeText(code).then(function () {
        copyBtn.textContent = 'コピーした！';
        setTimeout(function () { copyBtn.textContent = 'コピー'; }, 1500);
      }).catch(function () {});
    }
  });

  var lastCode = localStorage.getItem('dice_room_code');
  var lastName = localStorage.getItem('dice_name');
  if (lastCode) codeInput.value = lastCode;
  // Resume the previous room automatically (e.g. after a page reload) —
  // the 'connect' handler above sends the actual join_room once the
  // socket is up, and falls back to the entry screen if that room is gone.
  if (lastCode && lastName) {
    desired = { code: lastCode, name: lastName };
  }
})();
</script>
</body>
</html>
