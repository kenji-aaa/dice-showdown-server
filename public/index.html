  var RACE_METERS = 1600;
  var RC_W = 960, RC_H = 500, RC_START = 110, RC_COURSE = 9000;
  var RACE_COATS = ['#7a4a2a', '#a0522d', '#2b2420', '#a8a39a', '#c8a060'];
  var RACE_FONT = '"Zen Maru Gothic","Noto Sans JP",sans-serif';
  var raceCanvas = null;
  var raceCtx = null;

  function raceLanesHTML() { return '<canvas class="race-canvas" id="race-canvas"></canvas>'; }

  function raceCanvasInit() {
    raceLanes.classList.add('stage');
    raceCanvas = document.getElementById('race-canvas');
    var w = raceLanes.clientWidth || 800;
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    raceCanvas.width = Math.round(w * dpr);
    raceCanvas.height = Math.round(w * dpr * RC_H / RC_W);
    raceCtx = raceCanvas.getContext('2d');
    var k = raceCanvas.width / RC_W;
    raceCtx.setTransform(k, 0, 0, k, 0, 0);
  }

  // Keep the whole pack in frame when it fits; otherwise follow the leader. Near the end,
  // shift the view ahead so the goal comes into sight.
  function raceCamX(lf, tf, cam, snap) {
    var q = Math.max(0, Math.min(1, (lf - 0.78) / 0.17));
    var off = 0.66 - 0.54 * q * q * (3 - 2 * q);
    var leaderX = RC_START + lf * RC_COURSE;
    var tailX = RC_START + tf * RC_COURSE;
    var max = RC_START + RC_COURSE + 300 - RC_W;
    var want = leaderX - RC_W * off;
    if (q < 0.01) want = Math.max(Math.min(want, tailX - RC_W * 0.07), leaderX - RC_W * 0.9);
    var target = Math.max(0, Math.min(max, want));
    return snap ? target : cam + (target - cam) * 0.12;
  }

  function raceHash(n) { var x = Math.sin(n * 127.1) * 43758.5453; return x - Math.floor(x); }
  function raceRoundRect(c, x, y, w, hh, r) {
    c.beginPath();
    c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r);
    c.lineTo(x + w, y + hh - r); c.quadraticCurveTo(x + w, y + hh, x + w - r, y + hh);
    c.lineTo(x + r, y + hh); c.quadraticCurveTo(x, y + hh, x, y + hh - r);
    c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y); c.closePath();
  }

  function raceDrawHorse(c, x, y, s, ph, num, coat, silk, striped, lead, moving) {
    c.save();
    c.translate(x, y);
    c.scale(s, s);
    c.fillStyle = 'rgba(0,0,0,0.25)';
    c.beginPath(); c.ellipse(0, 1, 27, 4, 0, 0, 6.3); c.fill();
    if (lead) {
      var g = c.createRadialGradient(0, -26, 4, 0, -26, 56);
      g.addColorStop(0, 'rgba(255,225,90,0.6)');
      g.addColorStop(1, 'rgba(255,225,90,0)');
      c.fillStyle = g; c.beginPath(); c.arc(0, -26, 56, 0, 6.3); c.fill();
    }
    c.translate(0, moving ? -Math.abs(Math.sin(ph)) * 3 : 0);
    var dark = 'rgba(0,0,0,0.45)';
    var leg = function (hx, off, col) {
      var a = moving ? Math.sin(ph + off) : 0;
      var lift = moving ? Math.max(0, Math.cos(ph + off)) : 0;
      var kx = hx + a * 9;
      var fx = kx + a * 7 - lift * 3;
      c.strokeStyle = col; c.lineCap = 'round'; c.lineJoin = 'round'; c.lineWidth = 3.8;
      c.beginPath(); c.moveTo(hx, -18); c.lineTo(kx, -10 - lift * 3); c.lineTo(fx, -1 - lift * 8); c.stroke();
    };
    leg(-8, 0.6, coat); leg(8, Math.PI + 0.6, coat);
    c.fillStyle = dark; c.globalAlpha = 0.35;
    c.globalAlpha = 1;
    // tail
    c.strokeStyle = '#1b1512'; c.lineWidth = 4.5; c.lineCap = 'round';
    c.beginPath(); c.moveTo(-20, -28); c.quadraticCurveTo(-32, -30 + (moving ? Math.sin(ph) * 4 : 0), -39, -16 + (moving ? Math.sin(ph + 1) * 4 : 0)); c.stroke();
    // body
    c.fillStyle = coat;
    c.beginPath(); c.ellipse(0, -24, 21, 9.5, 0, 0, 6.3); c.fill();
    // neck + head
    c.beginPath(); c.moveTo(13, -30); c.lineTo(25, -48); c.lineTo(32, -43); c.lineTo(19, -19); c.closePath(); c.fill();
    c.save(); c.translate(31, -45); c.rotate(0.6);
    c.beginPath(); c.ellipse(0, 0, 10.5, 4.7, 0, 0, 6.3); c.fill();
    c.fillStyle = 'rgba(0,0,0,0.5)'; c.beginPath(); c.arc(7, 0.5, 1, 0, 6.3); c.fill();
    c.restore();
    c.fillStyle = coat; c.beginPath(); c.moveTo(24, -50); c.lineTo(26, -57); c.lineTo(29, -49); c.closePath(); c.fill();
    c.strokeStyle = '#1b1512'; c.lineWidth = 3;
    c.beginPath(); c.moveTo(12, -31); c.quadraticCurveTo(21, -45, 25, -50); c.stroke();
    leg(-12, 0, coat); leg(12, Math.PI, coat);
    // number cloth
    c.fillStyle = '#fff'; c.fillRect(-9, -31, 12, 10);
    c.fillStyle = '#222'; c.font = 'bold 9px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(String(num), -3, -25.5);
    // jockey
    c.save(); c.translate(2, -37); c.rotate(0.75);
    c.fillStyle = silk; c.beginPath(); c.ellipse(0, 0, 6.5, 5, 0, 0, 6.3); c.fill();
    if (striped) { c.fillStyle = '#fff'; c.fillRect(-1.5, -5, 3, 10); }
    c.restore();
    c.strokeStyle = '#f2c9a0'; c.lineWidth = 2.4; c.beginPath(); c.moveTo(5, -40); c.lineTo(17, -39); c.stroke();
    c.fillStyle = '#f2c9a0'; c.beginPath(); c.arc(10, -45, 3.5, 0, 6.3); c.fill();
    c.fillStyle = silk; c.beginPath(); c.arc(10, -45.8, 3.7, Math.PI, 0); c.fill();
    c.restore();
  }

  function raceDraw(r, cur, cam, lead, moving, fastFx, ext) {
    var c = raceCtx;
    if (!c) return;
    var n = r.horses.length;
    var rk = r._rk || (r._rk = raceRanks(r));
    // sky + stand
    var g = c.createLinearGradient(0, 0, 0, 160);
    g.addColorStop(0, '#6fbdf0'); g.addColorStop(1, '#e3f4ff');
    c.fillStyle = g; c.fillRect(0, 0, RC_W, 160);
    c.fillStyle = '#7d8da3'; c.fillRect(0, 58, RC_W, 84);
    c.fillStyle = '#55637a'; c.fillRect(0, 52, RC_W, 8);
    var px = cam * 0.3;
    var crowd = ['#e57373', '#64b5f6', '#fff176', '#81c784', '#ffffff', '#ba68c8', '#ffb74d'];
    var i0 = Math.floor(px / 7);
    for (var cx = -(px - i0 * 7), ci = i0; cx < RC_W; cx += 7, ci++) {
      for (var row = 0; row < 7; row++) {
        var hv = raceHash(ci * 13 + row * 7.3);
        c.fillStyle = crowd[Math.floor(hv * 7)];
        c.fillRect(cx, 68 + row * 10 + ((hv * 3) | 0), 4, 5);
      }
    }
    // hedge + rail
    c.fillStyle = '#2d7a38'; c.fillRect(0, 140, RC_W, 20);
    c.fillStyle = '#fff'; c.fillRect(0, 154, RC_W, 3);
    var rp = cam * 0.9;
    for (var pxs = -(rp % 90); pxs < RC_W; pxs += 90) c.fillRect(pxs, 146, 3, 14);
    // turf
    var sw = 150, base = Math.floor(cam / sw);
    for (var k = base; k * sw - cam < RC_W; k++) {
      c.fillStyle = (k & 1) ? '#3a9341' : '#44a24b';
      c.fillRect(k * sw - cam, 158, sw + 1, RC_H - 158);
    }
    var laneStep = Math.min(40, (RC_H - 205 - 14) / Math.max(1, n));
    var baseY = 215;
    c.strokeStyle = 'rgba(255,255,255,0.10)'; c.lineWidth = 1;
    for (var li = 0; li <= n; li++) {
      var ly = baseY + (li - 0.5) * laneStep - 1;
      c.beginPath(); c.moveTo(0, ly); c.lineTo(RC_W, ly); c.stroke();
    }
    // distance poles
    var poles = [1200, 800, 400, 200];
    poles.forEach(function (m) {
      var sx = RC_START + (1 - m / RACE_METERS) * RC_COURSE - cam;
      if (sx < -40 || sx > RC_W + 40) return;
      c.fillStyle = '#d32f2f'; c.fillRect(sx - 2, 112, 4, 46);
      c.fillStyle = '#fff'; c.fillRect(sx - 2, 124, 4, 8); c.fillRect(sx - 2, 142, 4, 8);
      c.fillStyle = '#fff'; raceRoundRect(c, sx - 24, 98, 48, 20, 4); c.fill();
      c.strokeStyle = '#d32f2f'; c.lineWidth = 2; c.stroke();
      c.fillStyle = '#d32f2f'; c.font = 'bold 14px ' + RACE_FONT; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(String(m), sx, 109);
    });
    // start line
    var ssx = RC_START - 30 - cam;
    if (ssx > -60) {
      c.fillStyle = '#fff'; c.fillRect(ssx, 158, 5, RC_H - 158);
      c.fillStyle = '#1565c0'; raceRoundRect(c, ssx - 30, 96, 66, 22, 4); c.fill();
      c.fillStyle = '#fff'; c.font = 'bold 14px ' + RACE_FONT; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText('START', ssx + 3, 107);
    }
    // goal
    var gx = RC_START + RC_COURSE - cam;
    if (gx < RC_W + 100) {
      for (var gy = 158; gy < RC_H; gy += 10) {
        c.fillStyle = ((gy / 10) & 1) ? '#111' : '#fff'; c.fillRect(gx, gy, 10, 10);
        c.fillStyle = ((gy / 10) & 1) ? '#fff' : '#111'; c.fillRect(gx + 10, gy, 10, 10);
      }
      c.fillStyle = '#eee'; c.fillRect(gx - 3, 40, 6, 118); c.fillRect(gx + 17, 40, 6, 118);
      c.fillStyle = '#c4121c'; raceRoundRect(c, gx - 50, 28, 120, 38, 8); c.fill();
      c.strokeStyle = '#ffd54f'; c.lineWidth = 3; c.stroke();
      c.fillStyle = '#fff'; c.font = 'bold 26px ' + RACE_FONT; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText('GOAL', gx + 10, 48);
    }
    // horses, far lane first
    for (var i = 0; i < n; i++) {
      var wx = RC_START + (cur[i] / 1000) * RC_COURSE + (ext ? ext.x[i] : 0);
      var x = wx - cam;
      if (x < -80 || x > RC_W + 70) continue;
      var y = baseY + i * laneStep;
      var s = Math.max(0.5, Math.min(1.15, laneStep / 22)) * (0.9 + 0.2 * (n > 1 ? i / (n - 1) : 1));
      var silk = RACE_COLORS[i % RACE_COLORS.length];
      var isLead = i === lead && cur[lead] < 1000;
      raceDrawHorse(c, x, y, s, wx / 20 + i * 0.7, i + 1, RACE_COATS[i % 5], silk, i >= 8, isLead, ext ? ext.mv[i] : moving);
      var me = r.horses[i].id === playerId;
      c.font = 'bold ' + Math.round(11 * Math.max(0.9, s)) + 'px ' + RACE_FONT;
      c.textAlign = 'right'; c.textBaseline = 'middle';
      c.lineWidth = 3; c.strokeStyle = 'rgba(255,255,255,0.92)';
      var label = (me ? '▶' : '') + r.horses[i].name;
      c.strokeText(label, x - 38 * s, y - 8 * s);
      c.fillStyle = silk; c.fillText(label, x - 38 * s, y - 8 * s);
    }
    // speed streaks
    if (fastFx > 0) {
      c.strokeStyle = 'rgba(255,255,255,' + (0.1 + 0.2 * fastFx) + ')'; c.lineWidth = 2;
      for (var j = 0; j < 16; j++) {
        var sy = 168 + raceHash(j * 3.1) * 320;
        var len = 80 + raceHash(j * 5.7) * 160;
        var sxx = ((raceHash(j * 9.3) * (RC_W + 400)) - cam * 1.7) % (RC_W + 400);
        if (sxx < 0) sxx += RC_W + 400;
        sxx -= 200;
        c.beginPath(); c.moveTo(sxx, sy); c.lineTo(sxx + len, sy); c.stroke();
      }
    }
    // HUD: mini oval
    c.fillStyle = 'rgba(0,0,0,0.5)'; raceRoundRect(c, 10, 10, 168, 98, 10); c.fill();
    var mx = 94, my = 60, mrx = 64, mry = 30;
    c.strokeStyle = '#d9b77e'; c.lineWidth = 10;
    c.beginPath(); c.ellipse(mx, my, mrx, mry, 0, 0, 6.3); c.stroke();
    c.strokeStyle = '#3d9645'; c.lineWidth = 3;
    c.beginPath(); c.ellipse(mx, my, mrx, mry, 0, 0, 6.3); c.stroke();
    c.fillStyle = '#fff'; c.fillRect(mx - 1.5, my + mry - 6, 3, 12);
    var order = cur.map(function (v, i) { return [v, i]; }).sort(function (a, b2) { return (b2[0] - a[0]) || (rk[a[1]] - rk[b2[1]]); });
    for (var d = n - 1; d >= 0; d--) {
      var di = order[d][1];
      var ang = Math.PI / 2 - (cur[di] / 1000) * 2 * Math.PI;
      var dx = mx + mrx * Math.cos(ang), dy = my + mry * Math.sin(ang);
      c.fillStyle = RACE_COLORS[di % RACE_COLORS.length];
      c.strokeStyle = '#fff'; c.lineWidth = d === 0 ? 2 : 1;
      c.beginPath(); c.arc(dx, dy, d === 0 ? 5.5 : 3.6, 0, 6.3); c.fill(); c.stroke();
    }
    // HUD: remaining
    var rem = Math.max(0, Math.ceil((1000 - cur[lead]) * RACE_METERS / 1000 / 10) * 10);
    c.fillStyle = 'rgba(0,0,0,0.55)'; raceRoundRect(c, RC_W / 2 - 105, 10, 210, 42, 21); c.fill();
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillStyle = rem <= 200 ? '#ffd54f' : '#fff';
    c.font = 'bold 24px ' + RACE_FONT;
    c.fillText(rem > 0 ? '残り ' + rem + ' m' : 'ゴール！', RC_W / 2, 32);
    // HUD: top 5
    if (r._judge) {
      c.fillStyle = 'rgba(0,0,0,0.6)'; raceRoundRect(c, RC_W - 200, 10, 190, 36, 10); c.fill();
      c.fillStyle = (Math.floor(Date.now() / 400) % 2) ? '#ffb74d' : '#fff';
      c.font = 'bold 15px ' + RACE_FONT; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText('📷 写真判定中', RC_W - 105, 28);
    }
    var rows = r._judge ? 0 : Math.min(5, n);
    if (rows) { c.fillStyle = 'rgba(0,0,0,0.5)'; raceRoundRect(c, RC_W - 200, 10, 190, 14 + rows * 22, 10); c.fill(); }
    for (var q = 0; q < rows; q++) {
      var qi = order[q][1];
      var qy = 28 + q * 22;
      c.fillStyle = RACE_COLORS[qi % RACE_COLORS.length];
      c.beginPath(); c.arc(RC_W - 180, qy, 9, 0, 6.3); c.fill();
      c.fillStyle = '#fff'; c.font = 'bold 11px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(String(qi + 1), RC_W - 180, qy + 0.5);
      c.textAlign = 'left'; c.font = 'bold 13px ' + RACE_FONT;
      c.fillStyle = q === 0 ? '#ffd54f' : '#fff';
      c.fillText((q + 1) + '位  ' + r.horses[qi].name, RC_W - 164, qy + 0.5);
    }
  }

  function raceRanks(r) {
    var ranks = new Array(r.horses.length);
    r.order.forEach(function (idx, k) { ranks[idx] = k + 1; });
    return ranks;
  }

  function raceResultHTML(r) {
    var ranks = raceRanks(r);
    return r.order.map(function (idx, k) {
      var hs = r.horses[idx];
      var me = hs.id === playerId;
      var rk = k === 0 ? '🥇' : k === 1 ? '🥈' : k === 2 ? '🥉' : (k + 1) + '位';
      return '<div class="row' + (me ? ' me' : '') + (k === 0 ? ' first' : '') + '"><span class="rk">' + rk + '</span><span>' + escapeHtml(hs.name) + (me ? '（あなた）' : '') + '</span></div>';
    }).join('');
  }

  function raceInterp(r, s) {
    var S = r.pos.length;
    var a = Math.max(0, Math.min(S - 1, Math.floor(s)));
    var b = Math.min(S - 1, a + 1);
    var f = Math.max(0, Math.min(1, s - a));
    return r.pos[a].map(function (v, i) { return v + (r.pos[b][i] - v) * f; });
  }

  function raceStatic(r) {
    var ranks = raceRanks(r);
    raceLanes.innerHTML = raceLanesHTML();
    raceCanvasInit();
    var fin = ranks.map(function (rk) { return 1000 - (rk - 1) * 4; });
    var past = { x: ranks.map(function (rk) { return Math.max(20, 250 - (rk - 1) * 12); }), mv: ranks.map(function () { return false; }) };
    raceLedBuild(r, true);
    raceDraw(r, fin.map(function () { return 1000; }), raceCamX(1, 1, 0, true), r.order[0], false, 0, past);
    var w = r.horses[r.order[0]];
    raceCall.className = 'race-call';
    raceCall.textContent = '🏆 優勝は ' + w.name + ' さん！';
    raceStanding.textContent = '';
    raceResult.innerHTML = raceResultHTML(r);
    raceResult.classList.toggle('pop', raceFreshReveal);
    if (raceFreshReveal) {
      Array.prototype.forEach.call(raceResult.children, function (row, k) { row.style.animationDelay = (k * 0.13) + 's'; });
      raceFreshReveal = false;
    }
  }

  function racePlay(r) {
    raceAnim = true;
    raceResult.innerHTML = '';
    raceStanding.textContent = '';
    raceAgainBtn.hidden = true;
    raceLedEl.hidden = true;
    raceLanes.innerHTML = raceLanesHTML();
    raceCanvasInit();
    var n = r.horses.length;
    var S = r.pos.length;
    var cam = 0;
    raceDraw(r, r.pos[0], 0, 0, false, 0);
    // after crossing, each horse keeps galloping and eases off
    var TAU = 6;
    var cross = [];
    var v0 = [];
    for (var ci = 0; ci < n; ci++) {
      cross[ci] = 1e9; v0[ci] = 0;
      for (var cf = 1; cf < S; cf++) {
        if (r.pos[cf][ci] >= 1000) {
          var pv = r.pos[cf - 1][ci];
          cross[ci] = cf - 1 + (1000 - pv) / Math.max(1, r.pos[cf][ci] - pv);
          var cb = Math.max(0, cf - 3);
          v0[ci] = (r.pos[cf][ci] - r.pos[cb][ci]) / (cf - cb) / 1000 * RC_COURSE;
          break;
        }
      }
    }
    var END = S - 1 + 30;
    function raceOverrun(sv) {
      var o = { x: [], mv: [] };
      for (var oi = 0; oi < n; oi++) {
        var t = sv - cross[oi];
        if (t <= 0) { o.x.push(0); o.mv.push(true); continue; }
        o.x.push(v0[oi] * TAU * (1 - Math.exp(-t / TAU)));
        o.mv.push(v0[oi] * Math.exp(-t / TAU) > 1.5);
      }
      return o;
    }
    // fanfare -> 位置について -> よーい -> pistol
    raceCall.className = 'race-call count small';
    raceCall.textContent = '🎺 まもなく発走！';
    raceFxEl().classList.add('dark');
    raceBig('まもなく発走！', 'mid gold', 2600);
    playBrassFanfare();
    raceLater(function () { raceCall.textContent = '位置について…'; raceBig('位置について…', 'mid', 1200); playKick(0.6); }, 4600);
    raceLater(function () { raceCall.textContent = 'よーい…'; raceBig('よーい…', 'mid', 1700); playKick(0.7); }, 5800);

    raceLater(function () {
      playPistol(); flashScreen(); raceRing();
      raceFxEl().classList.remove('dark');
      raceBig('GO!!', 'gold', 1000);
      raceCrowd = startCrowd();
      raceBoardEl.classList.add('race-shake');
      raceLater(function () { raceBoardEl.classList.remove('race-shake'); }, 600);
      raceCall.className = 'race-call count small';
      raceCall.textContent = '🔫 スタート！';
      raceLater(function () { raceCall.className = 'race-call'; }, 900);
      var nextMs = 0;
      var MILES = [1000, 500, 300, 200, 100];
      var s = 0;
      var last = performance.now();
      var leader = -1;
      var lastCallAt = 0;
      var winnerDone = false;
      var lastHoof = 0;
      var lastDraw = null;

      function frame(now) {
        var dt = now - last;
        last = now;
        var cur = raceInterp(r, s);
        var lead = 0;
        for (var i = 1; i < n; i++) if (cur[i] > cur[lead]) lead = i;
        var rate = 1;
        s = Math.min(END, s + (dt / r.stepMs) * rate);
        cur = raceInterp(r, s);
        lead = 0;
        for (var j = 1; j < n; j++) if (cur[j] > cur[lead]) lead = j;

        cam = raceCamX(cur[lead] / 1000, Math.min.apply(null, cur) / 1000, cam, false);

        if (document.getElementById('race-game').hidden) { raceStop(); return; }
        var remNow = Math.max(0, Math.ceil((1000 - cur[lead]) * RACE_METERS / 1000 / 10) * 10);
        var prog = cur[lead] / 1000;
        if (!winnerDone && nextMs < MILES.length && remNow <= MILES[nextMs] && remNow > 0) {
          var ms = MILES[nextMs];
          raceCall.textContent = '🏁 ゴールまで あと ' + ms + 'm！';
          lastCallAt = now;
          if (ms <= 500) {
            raceBig(ms === 200 ? 'ラスト200m！' : 'あと' + ms + 'm！', ms <= 200 ? '' : 'mid', ms <= 200 ? 1200 : 1000);
            playRiser(1.0);
          } else {
            playAmidaTones([880], 0.1);
          }
          nextMs++;
        }
        // mood: speed lines build, red vignette + shake in the home stretch, dark zoom in the photo finish
        var fxEl = raceFxEl();
        var slow = rate < 1 ? (1 - rate) / 0.7 : 0;
        var vigEl = fxEl.querySelector('.vig');
        vigEl.classList.toggle('dim', slow > 0.05);
        fxEl.style.setProperty('--vig', winnerDone ? '0' : slow > 0.05 ? String(0.4 + 0.6 * slow) : remNow <= 400 ? '0.8' : '0');
        raceBoardEl.classList.toggle('race-shake', !winnerDone && remNow <= 300 && slow < 0.05);
        raceLanes.style.transformOrigin = '85% 50%';
        raceLanes.style.transform = slow > 0 ? 'scale(' + (1 + 0.05 * slow) + ')' : '';
        if (raceCrowd) raceCrowd.level(prog);
        var hoofGap = 270 - 130 * prog;
        if (now - lastHoof > hoofGap) { lastHoof = now; playKick(0.1 + 0.18 * prog); }

        if (lead !== leader && cur[lead] > 40 && !winnerDone) {
          if (leader !== -1 && now - lastCallAt > 900) {
            lastCallAt = now;
            raceCall.textContent = '🔥 ' + r.horses[lead].name + ' が先頭に立った！';
            playAmidaTones([660, 880], 0.07);
          }
          leader = lead;
        }

        if (!winnerDone && cur[lead] >= 1000) {
          winnerDone = true;
          r._judge = true;
          var win = r.horses[r.order[0]];
          var top = Math.min(5, r.horses.length);
          raceCall.textContent = 'ゴール！！';
          raceStanding.textContent = '';
          if (raceCrowd) { raceCrowd.stop(true); raceCrowd = null; }
          raceBoardEl.classList.remove('race-shake');
          raceLanes.style.transform = '';
          // lag, then the 電光掲示板 announces the finishing order from the bottom up
          raceLater(function () {
            raceCall.textContent = '📷 写真判定中…';
            raceLedBuild(r, false);
            raceLedEl.scrollIntoView({ behavior: 'smooth', block: 'end' });
            playKick(0.5);
          }, 1800);
          for (var jb = 0; jb < 6; jb++) raceLater(function () { playKick(0.35); }, 2400 + jb * 600);
          var tRev = 4200;
          for (var kk = top - 1; kk >= 1; kk--) {
            (function (k2, t2) {
              raceLater(function () { raceLedReveal(r, k2); playAmidaTones([392 + (top - k2) * 70], 0.1); }, t2);
            })(kk, tRev + (top - 1 - kk) * 700);
          }
          var tWin = tRev + (top - 1) * 700 + 1500;
          raceLater(function () { raceBig('来週の朝礼は…', 'mid', 2700); playRiser(2.4); }, tWin);
          for (var jc = 0; jc < 8; jc++) raceLater(function () { playKick(0.5); }, tWin + jc * 330);
          raceLater(function () {
            r._judge = false;
            if (lastDraw) raceDraw.apply(null, lastDraw);
            raceLedReveal(r, 0);
            document.getElementById('led-judge').style.display = 'none';
            document.getElementById('led-ok').classList.add('on');
            raceCall.textContent = '🏆 優勝は ' + win.name + ' さん！';
            playCrash(); playFanfare(); flashScreen(); raceRing(); launchConfetti(5200);
            raceBig(win.name, 'gold', 2600);
            raceLater(function () { launchConfetti(3000); }, 1500);
          }, tWin + 2800);
          raceLater(function () { raceAnim = false; raceFreshReveal = true; raceFxOff(); renderRace(); }, tWin + 2800 + 3600);
        }

        lastDraw = [r, cur, cam, lead, true, 0, raceOverrun(s)];
        raceDraw(r, cur, cam, lead, true, winnerDone ? 0 : 0.3 + 0.7 * prog, lastDraw[6]);
        var ranksNow = raceRanks(r);
        var order = cur.map(function (v, i) { return [v, i]; }).sort(function (a, b) { return (b[0] - a[0]) || (ranksNow[a[1]] - ranksNow[b[1]]); });
        if (!winnerDone) raceStanding.textContent = order.slice(0, 3).map(function (o, k2) { return (k2 + 1) + '位 ' + r.horses[o[1]].name; }).join('　');

        if (s >= END) {
          raceRaf = null;
          return;
        }
        raceRaf = requestAnimationFrame(frame);
      }
      raceRaf = requestAnimationFrame(frame);
    }, 7000);
  }

  function renderRace() {
    var r = latestData.race;
    raceSetupDiv.hidden = !!r;
    raceBoard.hidden = !r;
    var specs = latestData.spectators || [];
    if (!r) {
      raceLedEl.hidden = true;
      raceStop();
      raceSession = null;
      var count = (latestData.players || []).length - specs.length;
      document.getElementById('race-count-note').textContent = count + '頭でレースをします';
      raceStartBtn.disabled = count < 2;
      if (latestData.hostId === playerId) document.getElementById('race-err').textContent = count < 2 ? '2人以上で遊べます。参加者を待ってください。' : '';
      return;
    }
    if (r.id !== raceSession) { raceStop(); raceSession = r.id; raceSeen = null; }
    if (raceSeen !== r.id && !raceAnim) {
      raceSeen = r.id;
      if (!r.done) { racePlay(r); return; }
    }
    if (raceAnim) return;
    raceStatic(r);
    raceAgainBtn.hidden = false;
  }

  raceStartBtn.addEventListener('click', function () { if (isConnected) socket.emit('race_start'); });
  raceAgainBtn.addEventListener('click', function () { if (isConnected) socket.emit('race_reset'); });

  var cardsSetupDiv = document.getElementById('cards-setup');
  var cardsBoard = document.getElementById('cards-board');
  var cardsGrid = document.getElementById('cards-grid');
  var cardsHint = document.getElementById('cards-hint');
  var cardsStatus = document.getElementById('cards-status');
  var cardsRevealBtn = document.getElementById('cards-reveal-btn');
  var cardsSetupBtn = document.getElementById('cards-setup-btn');
  var cardsCancelBtn = document.getElementById('cards-cancel-btn');
  var cardsAgainBtn = document.getElementById('cards-again-btn');
  var cardsSession = null;
  var cardsRevealSeen = null;
  var cardsAnimating = false;
  var cardsTimers = [];

  function cardsClearTimers() { cardsTimers.forEach(clearTimeout); cardsTimers = []; cardsAnimating = false; }
  function cardsLater(fn, ms) { cardsTimers.push(setTimeout(fn, ms)); }

  // finished: everything face up. waiting: misses already turned, the final
  // two shaking until one of their holders clicks.
  function cardsGridHTML(c, finished, waiting) {
    var out = '';
    var n = c.n;
    var lastTwo = c.revealed ? c.order.slice(n - 2) : [];
    var singles = c.revealed ? c.order.slice(0, n - 2) : [];
    for (var i = 0; i < n; i++) {
      var pid = c.picks[i];
      var mine = pid === playerId;
      var isAtari = c.revealed && i === c.atari;
      var up = finished || (waiting && singles.indexOf(i) !== -1);
      var shake = waiting && lastTwo.indexOf(i) !== -1;
      var live = shake && (mine || latestData.hostId === playerId);
      var cls = 'card3d' + (pid ? ' taken' : '') + (mine ? ' mine' : '') + (up ? ' flipped' : '') +
        (isAtari && finished ? ' atari' : '') + (shake ? ' shake' : '') + ((c.revealed && !live) ? ' disabled' : '');
      out += '<div class="' + cls + '" data-i="' + i + '"><div class="inner">' +
        '<div class="face back">' + (i + 1) + '</div>' +
        '<div class="face front">' + (c.revealed ? (isAtari ? '<span class="em">☠</span><span class="lb">当たり</span>' : '<span class="em">👼</span><span class="lb">はずれ</span>') : '') + '</div></div>' +
        '<div class="who">' + (pid ? escapeHtml(nameForPid(pid)) + (mine ? '（あなた）' : '') : '空き') + '</div></div>';
    }
    return out;
  }

  function cardsCelebrate(c) {
    var winner = nameForPid(c.picks[c.atari]);
    cardsHint.className = 'amida-hint big';
    cardsHint.textContent = '🎉 当たりは ' + winner + ' さん！';
    playFanfare(); flashScreen(); launchConfetti(4600);
    amidaBanner.classList.add('big');
    showAmidaBanner('🎉 ' + winner + ' が当たり！');
    cardsLater(function () { amidaBanner.classList.remove('big'); }, 3200);
  }

  // Step 1: turn the misses over one at a time, then stop with the last two
  // cards shaking and wait for one of their holders to click.
  function playCardsReveal(c) {
    cardsAnimating = true;
    cardsGrid.innerHTML = cardsGridHTML(c, false, false);
    cardsRevealBtn.hidden = true; cardsCancelBtn.hidden = true; cardsAgainBtn.hidden = true;
    cardsStatus.textContent = '';
    cardsHint.className = 'amida-hint big';
    cardsHint.textContent = 'めくるよ…！';
    var nodes = cardsGrid.children;
    var n = c.order.length;
    var singles = c.order.slice(0, n - 2);
    singles.forEach(function (idx, k) {
      cardsLater(function () {
        nodes[idx].classList.add('flipped');
        playAmidaTones([480 + k * 45], 0.04);
        var left = n - k - 1;
        cardsHint.textContent = left > 2 ? 'あと' + left + '枚…' : '';
      }, 800 + k * 500);
    });
    cardsLater(function () { cardsAnimating = false; renderCards(); }, 800 + singles.length * 500 + 500);
  }

  // Step 2: the clicked card turns over; then its partner.
  function playLastFlip(c) {
    cardsAnimating = true;
    cardsRevealBtn.hidden = true; cardsCancelBtn.hidden = true; cardsAgainBtn.hidden = true;
    cardsStatus.textContent = '';
    cardsGrid.innerHTML = cardsGridHTML(c, false, true);
    var nodes = cardsGrid.children;
    var other = c.order.slice(c.n - 2).filter(function (i) { return i !== c.lastFlip; })[0];
    var clickedAtari = c.lastFlip === c.atari;
    cardsHint.className = 'amida-hint big';
    cardsHint.textContent = nameForPid(c.picks[c.lastFlip]) + ' さんのカードをめくります…';
    for (var t = 0; t < 8; t++) cardsLater(function () { playAmidaTones([90], 0.09); }, t * 240);
    cardsLater(function () {
      nodes[c.lastFlip].classList.remove('shake');
      nodes[c.lastFlip].classList.add('flipped');
      if (clickedAtari) { nodes[c.lastFlip].classList.add('atari'); cardsCelebrate(c); }
      else { cardsHint.textContent = 'はずれ…！ということは…'; playAmidaTones([300, 240], 0.15); }
    }, 2000);
    cardsLater(function () {
      nodes[other].classList.remove('shake');
      nodes[other].classList.add('flipped');
      if (!clickedAtari) { nodes[other].classList.add('atari'); cardsCelebrate(c); }
    }, clickedAtari ? 3600 : 4000);
    cardsLater(function () { cardsAnimating = false; renderCards(); }, clickedAtari ? 5200 : 5600);
  }

  var cardsLastSeen = null;

  function renderCards() {
    var c = latestData.cards;
    cardsSetupDiv.hidden = !!c;
    cardsBoard.hidden = !c;
    var specs = latestData.spectators || [];
    if (!c) {
      cardsClearTimers();
      cardsSession = null;
      var count = (latestData.players || []).length - specs.length;
      document.getElementById('cards-count-note').textContent = count + '人でカードを配ります';
      cardsSetupBtn.disabled = count < 2;
      if (latestData.hostId === playerId) document.getElementById('cards-err').textContent = count < 2 ? '2人以上で遊べます。参加者を待ってください。' : '';
      return;
    }
    if (c.id !== cardsSession) { cardsClearTimers(); cardsSession = c.id; cardsRevealSeen = null; cardsLastSeen = null; }

    if (c.revealed && cardsRevealSeen !== c.id && !cardsAnimating) {
      cardsRevealSeen = c.id;
      if (!c.done && c.lastFlip === null) { playCardsReveal(c); return; }
    }
    if (cardsAnimating) return;
    if (c.revealed && c.lastFlip !== null && cardsLastSeen !== c.id) {
      cardsLastSeen = c.id;
      if (!c.done) { playLastFlip(c); return; }
    }

    var finished = c.revealed && c.lastFlip !== null;
    var waiting = c.revealed && c.lastFlip === null;
    cardsGrid.innerHTML = cardsGridHTML(c, finished, waiting);
    var taken = c.picks.filter(function (p) { return p !== null; }).length;
    if (finished) {
      cardsHint.className = 'amida-hint big';
      cardsHint.textContent = '🎉 当たりは ' + nameForPid(c.picks[c.atari]) + ' さん！';
      cardsStatus.textContent = '';
    } else if (waiting) {
      var last = c.order.slice(c.n - 2);
      var iHold = last.some(function (i) { return c.picks[i] === playerId; });
      var names = last.map(function (i) { return nameForPid(c.picks[i]); }).join(' さんと ');
      cardsHint.className = 'amida-hint big';
      cardsHint.textContent = iHold ? '👉 残り2枚！あなたのカードをクリックしてめくって！' : '残り2枚！' + names + ' さんのどちらかがめくります…';
      cardsStatus.textContent = latestData.hostId === playerId && !iHold ? '（反応がなければ、部屋主が代わりにどちらかをクリックできます）' : '';
    } else {
      cardsHint.className = 'amida-hint';
      cardsHint.textContent = specs.indexOf(playerId) !== -1 ? '観戦中です' : '好きなカードをタップして選んでください（もう一度タップで取り消し）';
      cardsStatus.textContent = taken + ' / ' + c.n + '人が選択済み';
    }
    cardsRevealBtn.disabled = taken !== c.n;
    cardsRevealBtn.hidden = c.revealed;
    cardsCancelBtn.hidden = c.revealed && finished;
    cardsAgainBtn.hidden = !finished;
  }

  cardsGrid.addEventListener('click', function (e) {
    var el = e.target.closest('.card3d');
    var c = latestData && latestData.cards;
    if (!el || !c || !isConnected || cardsAnimating) return;
    var idx = parseInt(el.getAttribute('data-i'), 10);
    if (c.revealed) {
      if (c.lastFlip !== null) return;
      if (c.order.slice(c.n - 2).indexOf(idx) === -1) return;
      if (c.picks[idx] !== playerId && latestData.hostId !== playerId) return;
      socket.emit('cards_flip_last', { idx: idx });
      return;
    }
    if ((latestData.spectators || []).indexOf(playerId) !== -1) return;
    var holder = c.picks[idx];
    if (holder && holder !== playerId) return;
    socket.emit('cards_pick', { idx: idx });
  });
  cardsSetupBtn.addEventListener('click', function () { if (isConnected) socket.emit('cards_setup'); });
  cardsRevealBtn.addEventListener('click', function () { if (isConnected) socket.emit('cards_reveal'); });
  cardsCancelBtn.addEventListener('click', function () { if (isConnected) socket.emit('cards_reset'); });
  cardsAgainBtn.addEventListener('click', function () { if (isConnected) socket.emit('cards_reset'); });

  document.getElementById('member-list').addEventListener('click', function (e) {
    var chip = e.target.closest('.member-chip.pick');
    if (!chip || !latestData || latestData.hostId !== playerId || !isConnected) return;
    var pid = chip.getAttribute('data-pid');
    var isSpec = (latestData.spectators || []).indexOf(pid) !== -1;
    socket.emit('set_spectator', { pid: pid, value: !isSpec });
  });

  var chosenGame = localStorage.getItem('dice_game') || 'dice';
  var entryGamesEl = document.getElementById('entry-games');
  var roomGameNameEl = document.getElementById('room-game-name');
  var GAME_LABELS = { dice: '🎲 ダイス対決', amida: '🪜 あみだくじ', roulette: '🎡 ルーレット', cards: '🃏 カードめくり', race: '🏇 競馬' };
  function paintEntryGames() {
    Array.prototype.forEach.call(entryGamesEl.children, function (b) {
      b.classList.toggle('active', b.getAttribute('data-game') === chosenGame);
    });
  }
  entryGamesEl.addEventListener('click', function (e) {
    var b = e.target.closest('[data-game]');
    if (!b) return;
    chosenGame = b.getAttribute('data-game');
    try { localStorage.setItem('dice_game', chosenGame); } catch (err) {}
    paintEntryGames();
  });
  paintEntryGames();

  createBtn.addEventListener('click', function () {
    var name = nameInput.value.trim();
    if (!name) { setErr('名前を入力してください。'); return; }
    setErr('');
    localStorage.setItem('dice_name', name);
    createBtn.disabled = true;
    desired = null;
    pendingCreateName = name;
    pendingCreateReq = playerId + '_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
    socket.emit('create_room', { name: name, pid: playerId, game: chosenGame, reqId: pendingCreateReq });
  });

  joinBtn.addEventListener('click', function () {
    var name = nameInput.value.trim();
    var code = codeInput.value.trim().toUpperCase();
    if (!name) { setErr('名前を入力してください。'); return; }
    if (code.length !== 4) { setErr('4文字の合言葉を入力してください。'); return; }
    setErr('');
    localStorage.setItem('dice_name', name);
    joinBtn.disabled = true;
    pendingCreateName = null;
    desired = { code: code, name: name };
    socket.emit('join_room', { code: code, name: name, pid: playerId });
  });

  rollBtn.addEventListener('click', function () {
    if (!latestData || isRolling) return;
    if (!isConnected) { statusLine.textContent = '接続が切れています。再接続を待ってからもう一度お試しください。'; return; }
    var round = latestData.round || 1;
    var activeIds = latestData.activeIds || null;
    if (activeIds && activeIds.indexOf(playerId) === -1) return;
    var myRoll = latestData.rolls && latestData.rolls[playerId];
    if (myRoll && myRoll.round === round) return;

    isRolling = true;
    rollBtn.disabled = true;
    rollBtn.textContent = '振っています…';
    diceStage.hidden = false;
    diceSum.classList.remove('show');

    bigDieEls.forEach(function (el) {
      el.die.className = 'big-die spinning';
      el.face.innerHTML = pipsHTML(randomFace());
    });

    var startedAt = Date.now();
    var flickerTimer = setInterval(function () {
      bigDieEls.forEach(function (el) {
        el.face.innerHTML = pipsHTML(randomFace());
      });
    }, 80);

    socket.emit('roll');

    var checkTimer = setInterval(function () {
      var elapsed = Date.now() - startedAt;
      var mine = latestData && latestData.rolls && latestData.rolls[playerId];
      var haveResult = mine && mine.round === round;

      if (haveResult && elapsed >= 900) {
        clearInterval(flickerTimer);
        clearInterval(checkTimer);
        settle(mine.values, mine.sum);
      } else if (elapsed > 6000) {
        clearInterval(flickerTimer);
        clearInterval(checkTimer);
        isRolling = false;
        diceStage.hidden = true;
        statusLine.textContent = '通信がタイムアウトしました。もう一度お試しください。';
        render();
      }
    }, 100);

    function settle(values, sum) {
      bigDieEls.forEach(function (el, idx) {
        el.face.innerHTML = pipsHTML(values[idx]);
        el.die.className = 'big-die landed';
      });
      diceSumVal.textContent = sum;
      diceSum.classList.add('show');
      setTimeout(function () {
        diceStage.hidden = true;
        isRolling = false;
        render();
      }, 800);
    }
  });

  nextRoundBtn.addEventListener('click', function () {
    if (!isConnected) { statusLine.textContent = '接続が切れています。再接続を待ってからもう一度お試しください。'; return; }
    socket.emit('next_round');
  });

  leaveBtn.addEventListener('click', function () {
    if (isConnected) socket.emit('leave_room');
    backToEntry('');
  });

  copyBtn.addEventListener('click', function () {
    var code = roomCodeDisplay.textContent;
    if (navigator.clipboard) {
      navigator.clipboard.writeText(code).then(function () {
        copyBtn.textContent = 'コピーした！';
        setTimeout(function () { copyBtn.textContent = 'コピー'; }, 1500);
      }).catch(function () {});
    }
  });

  var lastCode = localStorage.getItem('dice_room_code');
  var lastName = localStorage.getItem('dice_name');
  if (lastCode) codeInput.value = lastCode;
  // Resume the previous room automatically (e.g. after a page reload) —
  // the 'connect' handler above sends the actual join_room once the
  // socket is up, and falls back to the entry screen if that room is gone.
  if (lastCode && lastName) {
    desired = { code: lastCode, name: lastName };
  }
})();
</script>
</body>
</html>
